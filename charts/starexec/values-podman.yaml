# Podman development environment values
# Usage: helm template starexec ./charts/starexec -f ./charts/starexec/values-podman.yaml

deploymentMode: podman

image:
  repository: localhost/local/starexec
  tag: dev
  pullPolicy: Never

persistence:
  usePodmanVolumes: true
  podmanVolumes:
    data:
      name: "{{ .Values.volumePrefix }}-data"
    postgres:
      name: "{{ .Values.volumePrefix }}-postgres"

backend:
  type: "podman"

service:
  type: NodePort
  port: 7827
  targetPort: 8080
  nodePort: 30080

postgres:
  password: starexec_dev_password
  rootPassword: starexec_dev_password

env:
  LOG_LEVEL: "DEBUG"
  FLYWAY_BASELINE_ON_MIGRATE: "true"
  STAREXEC_WEB_ADDRESS: "localhost:7827"
  STAREXEC_URL_PREFIX: "http"
  STAREXEC_WEB_BASE_DIR: "/opt/tomcat/webapps/starexec"