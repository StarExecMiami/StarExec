# Production environment values for the canonical quokka deployment.
#
# This file is the single source of truth for production. Jenkins and manual
# Helm invocations targeting production should use this file.

image:
  repository: ghcr.io/starexecmiami/starexec
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: quokka

postgres:
  image:
    repository: docker.io/library/postgres
    tag: "15"
    pullPolicy: IfNotPresent
  host: localhost
  port: 5432
  user: starexec
  database: starexec
  existingSecret: starexec-postgres-credentials
  existingSecretKeys:
    user: user
    password: password
    database: database
    rootPassword: rootPassword
  persistence:
    enabled: true
    storageClass: starexec-nfs-rwo
    size: 20Gi

backend:
  type: kubernetes

kubernetes:
  jobNamespace: starexec
  jobImage: ghcr.io/starexecmiami/starexec-job-runner:latest
  jobImagePullPolicy: IfNotPresent
  jobServiceAccount: starexec-job
  maxConcurrentJobs: 50
  nodeSelector:
    starexec.org/worker: "true"
  dataPvc:
    existingClaim: starexec-data-rwx
    name: starexec-data-rwx
    storageClass: starexec-nfs-rwx
    size: 100Gi
    accessModes:
      - ReadWriteMany
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "32"
      memory: "250Gi"

persistence:
  enabled: true
  storageClass: starexec-nfs-rwo
  appDataSize: 100Gi
  backendSize: 5Gi
  sandboxSize: 5Gi
  workSize: 5Gi
  postgresDataSize: 20Gi
  existingClaims:
    data: starexec-data-rwx
    backend: starexec-backend-rwo
    sandbox: starexec-sandbox-rwo
    work: starexec-work-rwo
    postgres: starexec-postgres-rwo

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30080

ingress:
  enabled: false

monitoring:
  enabled: false

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

web:
  address: "quokka.acorn.miami.edu"
  urlPrefix: "https"
  proxyPort: 443

env:
  STAREXEC_EMAIL_SMTP: "mailgw.as.acorn.miami.edu"
  STAREXEC_EMAIL_PORT: "25"
  STAREXEC_EMAIL_FROM: "starexec@quokka.acorn.miami.edu"
