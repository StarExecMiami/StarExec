# Flyway configuration for different environments (PostgreSQL)


flyway.cleanDisabled=false

# Development
flyway.url=jdbc:postgresql://localhost:5432/starexec
flyway.user=starexec
flyway.password=starexec_password
flyway.schemas=starexec

# Tests
flyway.test.url=jdbc:postgresql://localhost:5432/starexec_test
flyway.test.user=starexec_test
flyway.test.password=test_password
flyway.test.schemas=starexec_test

# Staging (use environment variables for passwords)
flyway.staging.url=jdbc:postgresql://staging-db:5432/starexec
flyway.staging.user=starexec_staging
flyway.staging.password=${STAREXEC_STAGING_DB_PASSWORD}
flyway.staging.schemas=starexec

# Production (use environment variables for passwords)
flyway.prod.url=jdbc:postgresql://prod-db:5432/starexec
flyway.prod.user=starexec_prod
flyway.prod.password=${STAREXEC_PROD_DB_PASSWORD}
flyway.prod.schemas=starexec

# Common configurations
flyway.locations=classpath:db/migration
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.mixed=false
flyway.group=false
flyway.installedBy=flyway