name: Scientific fixture tooling

on:
  push:
    paths:
      - '.github/workflows/scientific-fixtures.yml'
      - 'scripts/scientific/**'
      - 'scripts/tests/test_eprover_fixture.py'
      - 'scripts/tests/test_verify_fixtures.py'
  pull_request:
    paths:
      - '.github/workflows/scientific-fixtures.yml'
      - 'scripts/scientific/**'
      - 'scripts/tests/test_eprover_fixture.py'
      - 'scripts/tests/test_verify_fixtures.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    name: Offline recipe, verifier and wrapper regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check wrapper syntax and portability
        run: |
          sh -n scripts/scientific/starexec_run_E-3.3.3-sequential
          shellcheck -s sh scripts/scientific/starexec_run_E-3.3.3-sequential
      - name: Verify tracked fixture lockfiles and provenance schema
        run: python3 scripts/scientific/verify_fixtures.py
      - name: Check source validation, verifier, packaging and wrapper behavior
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_eprover_fixture.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_verify_fixtures.py' -v
