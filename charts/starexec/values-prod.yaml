# Production environment values for the canonical quokka deployment.
#
# This file is the base production profile. Jenkins and manual Helm invocations
# targeting production should use this file; Jenkins overlays deploy-time image references.

image:
  repository: ghcr.io/starexecmiami/starexec
  # Manual deployments that keep `latest` should leave pullPolicy at Always.
  # CI/CD overrides tag and pullPolicy with a unique per-build tag + IfNotPresent.
  tag: latest
  pullPolicy: Always

replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: quokka

postgres:
  image:
    repository: docker.io/library/postgres
    tag: "15"
    pullPolicy: IfNotPresent
  host: localhost
  port: 5432
  user: starexec
  database: starexec
  existingSecret: starexec-postgres-credentials
  existingSecretKeys:
    user: user
    password: password
    database: database
    rootPassword: rootPassword
  persistence:
    enabled: true
    storageClass: starexec-nfs-rwo
    size: 20Gi

backend:
  type: kubernetes

kubernetes:
  jobNamespace: starexec
  # Immutable linux/amd64 manifest digest, not a tag.
  #
  # The compute nodes are isolated from the public registry and receive this image by
  # cluster-local side-load, so the reference has to name bytes that are already resident
  # rather than something to fetch. A tag cannot do that: ":latest" is mutable, and
  # Kubernetes derives Always as the pull policy from it, which asks isolated nodes to
  # reach a registry they cannot see.
  #
  # This pin previously lived only as a live Helm override while the chart default stayed
  # ":latest", so an upgrade whose values omitted it silently reverted the reference.
  # Recording it here is what stops that from recurring.
  #
  # sha256:63ae82d5... is the linux/amd64 manifest inside index sha256:b3b08512...,
  # built from StarExec revision faccd0aac917a9ce54d68dabd2e664a49beaaf18.
  # Deliberately the platform manifest and not the index digest, because that is the form
  # the workers' side-load was validated against.
  jobImage: ghcr.io/starexecmiami/starexec-job-runner@sha256:63ae82d539f7c26bc70f42036f968897fc110416043d2fedc8a917b828537cdd
  jobImagePullPolicy: IfNotPresent
  jobServiceAccount: starexec-job
  maxConcurrentJobs: 50
  nodeSelector:
    starexec.org/worker: "true"
  dataPvc:
    existingClaim: starexec-data-rwx
    name: starexec-data-rwx
    storageClass: starexec-nfs-rwx
    size: 100Gi
    accessModes:
      - ReadWriteMany
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "31"
      memory: "250Gi"

persistence:
  enabled: true
  storageClass: starexec-nfs-rwo
  appDataSize: 100Gi
  backendSize: 5Gi
  sandboxSize: 5Gi
  workSize: 5Gi
  postgresDataSize: 20Gi
  existingClaims:
    data: starexec-data-rwx
    backend: starexec-backend-rwo
    sandbox: starexec-sandbox-rwo
    work: starexec-work-rwo
    postgres: starexec-postgres-rwo

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30080

ingress:
  enabled: false

monitoring:
  enabled: false

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

web:
  address: "quokka.acorn.miami.edu"
  urlPrefix: "https"
  proxyPort: 443

env:
  STAREXEC_EMAIL_SMTP: "mailgw.as.acorn.miami.edu"
  STAREXEC_EMAIL_PORT: "25"
  STAREXEC_EMAIL_FROM: "starexec@quokka.acorn.miami.edu"
