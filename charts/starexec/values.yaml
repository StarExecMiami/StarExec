# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
image:
  repository: ghcr.io/starexecmiami/starexec
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
volumePrefix: starexec

persistence:
  enabled: true
  storageClass: ""
  size: 5Gi
  # Podman dev: Set usePodmanVolumes=true for named volumes (RECOMMENDED)
  # Legacy: useHostPathForPodman=true uses /tmp hostPath (not recommended)
  useHostPathForPodman: false
  usePodmanVolumes: false  # Override to true in values-dev.yaml
  
  # Named volume configuration for Podman (only when usePodmanVolumes=true)
  podmanVolumes:
    data:
      name: starexec-data
    postgres:
      name: starexec-postgres

postgres: # For production, use an external database
  image:
    repository: docker.io/library/postgres
    pullPolicy: IfNotPresent
    tag: 16
  host: localhost
  port: 5432
  user: starexec
  # password: MUST be overridden via env var or existingSecret
  database: starexec  # Fixed: moved from metadata.database to database
  # rootPassword: MUST be overridden via env var or existingSecret
  # In production DO NOT define password here
  # The chart only references an external secret

  # Support external secrets (recommended for production)
  existingSecret: ""  # If set, use this secret instead of creating one
  existingSecretKeys:
    user: "user"
    password: "password"
    database: "database"
    rootPassword: "rootPassword"

  persistence:
    enabled: false
    storageClass: ""
    size: 20Gi
  #   database: database
  #   rootPassword: rootPassword

env: {}

backend:
  type: "local"
  root: "/app/backend"
  workingDir: "/app/work"

dataDir: "/app/data"
sandboxDir: "/app/sandbox"

# Resource requests and limits
resources:
  app:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  postgres:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Database migration settings
# When postgres.host is localhost (bundled postgres), migrations run automatically
# via the application entrypoint. The migration job is only used for external databases.
migrations:
  enabled: true