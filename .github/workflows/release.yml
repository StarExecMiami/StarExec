name: Release Management

on:
  push:
    tags:
      - "v*"
      - "release-*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Verify multi-module structure
        run: |
          echo "Verifying multi-module Maven structure..."
          [ -f pom.xml ] && echo "✓ Parent POM found"
          [ -f starexec-app/pom.xml ] && echo "✓ StarExec App module POM found"

      - name: Build release artifacts
        run: |
          echo "Building release artifacts with multi-module Maven..."
          mvn clean install -DskipTests -Dmaven.test.skip=true -pl starexec-app

      - name: Verify WAR artifact
        run: |
          WAR_FILE="starexec-app/target/starexec.war"
          if [ -f "$WAR_FILE" ]; then
            echo "✓ WAR file found: $(ls -lh $WAR_FILE | awk '{print $5, $9}')"
          else
            echo "✗ WAR file not found"
            exit 1
          fi

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Determine the previous tag
          CURRENT_TAG="${{ github.ref_name }}"
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          # Generate changelog from commits
          if [ -z "$PREVIOUS_TAG" ]; then
            # First release - show all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h by %an)" --no-merges)
          else
            # Subsequent releases - show commits since last tag
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h by %an)" --no-merges)
          fi

          # Use multiline output for GITHUB_OUTPUT
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Previous tag: $PREVIOUS_TAG"
          echo "Current tag: $CURRENT_TAG"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            > **Release Date:** ${{ steps.date.outputs.date }}
            > **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ### 📋 Changes
            ${{ steps.changelog.outputs.changelog }}

            ### 🐳 Container Image
            **Registry:** `${{ env.REGISTRY }}`
            **Image:** `${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }}`

            Pull the image:
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.ref_name }}
            ```

            ### 📦 Build Information
            **Build System:** Maven Multi-Module
            - **Parent POM:** Centralized version and dependency management
            - **Module:** starexec-app (WAR packaging)
            - **Production Code:** starexec-app/src/main/java (226 files)
            - **Test Framework:** Isolated with WAR plugin exclusions (no test code in artifact)
            - **Test Code:** starexec-app/src/test/java (72 files)

            ### 📦 Artifacts
            - `starexec.war` - Web application archive (test code excluded ✓)
            - `starexeccommand.zip` - Command-line interface tool (includes JAR and documentation)

            ### 💻 StarExecCommand CLI
            Download the CLI tool directly:
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/latest/download/starexeccommand.zip
            unzip starexeccommand.zip
            java -jar StarexecCommand.jar
            ```

            ### ✅ Quality Assurance
            - Build: ✓ Passed (Maven multi-module structure)
            - WAR Verification: ✓ No test code in artifact
            - Security scans: ✓ Passed
            - Container validation: ✓ Passed

            ---
            *This release was automatically generated by GitHub Actions with Maven multi-module build*
          files: |
            starexec-app/target/starexec.war
            starexec-app/target/starexeccommand.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: starexec-app/target/starexec.war
          retention-days: 90

      - name: Generate release notes
        run: |
          echo "## 🎉 Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** $(if [[ '${{ github.ref_name }}' =~ rc|beta|alpha ]]; then echo 'Prerelease'; else echo 'Stable'; fi)" >> $GITHUB_STEP_SUMMARY
          echo "**Build System:** Maven Multi-Module" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Available Downloads" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Container Image](https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }})" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts available in workflow run" >> $GITHUB_STEP_SUMMARY

      - name: Notify on release failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${{ github.ref_name }} - Build Failed`,
              body: `The release build for tag \`${{ github.ref_name }}\` failed. Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details. Build system: Maven Multi-Module`,
              labels: ['bug', 'release']
            });
