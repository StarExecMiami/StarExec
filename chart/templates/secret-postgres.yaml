{{- /*
Create a Kubernetes Secret only when:
1. An external secret is NOT provided (postgres.existingSecret is empty)
2. Passwords are actually set in values (not empty strings)
For production prefer setting postgres.existingSecret and *not* storing secrets in values.yaml.
*/ -}}
{{- if and (not .Values.postgres.existingSecret) (and .Values.postgres.password .Values.postgres.rootPassword) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.name" . }}-secret-postgres
type: Opaque
data:
  user: {{ .Values.postgres.user | b64enc | quote }}
  password: {{ .Values.postgres.password | b64enc | quote }}
  database: {{ .Values.postgres.database | b64enc | quote }}
  rootPassword: {{ .Values.postgres.rootPassword | b64enc | quote }}
{{- else if not .Values.postgres.existingSecret }}
{{- fail "ERROR: postgres.password and postgres.rootPassword must be set when not using existingSecret" }}
{{- end }}
