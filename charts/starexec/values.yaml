# Default values for chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# ============================================================================
# DEPLOYMENT MODE CONFIGURATION
# ============================================================================
# Deployment mode is now derived from backend.type (see backend section below).
# hostPort binding is enabled automatically when backend.type is "podman".

# ============================================================================
# IMAGE CONFIGURATION
# ============================================================================
image:
  repository: ghcr.io/starexecmiami/starexec
  tag: latest
  # pullPolicy: IfNotPresent # Be careful: IfNotPresent with 'latest' prevents updates
  pullPolicy: Always # Recommended for 'latest' tags to ensure backend logic changes are picked up

# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================
replicaCount: 1
volumePrefix: starexec

# Pin the StarExec application deployment independently from job pod
# scheduling. Kubernetes-native benchmark job placement is controlled by
# kubernetes.nodeSelector below.
nodeSelector: {}

# Application data directories
dataDir: "/app/data"
sandboxDir: "/app/sandbox"

# ============================================================================
# BACKEND CONFIGURATION
# ============================================================================
backend:
  type: "local" # Options: local, podman, kubernetes, k8s, kubernetes-native, sge, oar
  root: "/app/backend"
  workingDir: "/app/work"
  hostDataPath: ""  # Set automatically by Makefile for DooD path translation

  # Local Backend specific configuration
  local:
    concurrency: 1
    forceSandbox: true
    useRunsolver: true
    gracefulShutdownSeconds: 30

# ============================================================================
# PERSISTENCE CONFIGURATION
# ============================================================================
persistence:
  enabled: true
  storageClass: ""
  existingClaims:
    data: ""
    backend: ""
    sandbox: ""
    work: ""
    postgres: ""

  # Storage size configurations
  appDataSize: 5Gi
  backendSize: 5Gi
  sandboxSize: 5Gi
  workSize: 5Gi
  postgresDataSize: 20Gi

  # Deployment-specific storage options
  # Podman: Uses named volumes managed by Podman
  usePodmanVolumes: false
  podmanVolumes:
    data:
      name: "{{ .Values.volumePrefix }}-data"
    postgres:
      name: "{{ .Values.volumePrefix }}-postgres"

  # MicroK8s: Uses hostPath for local development
  useHostPath: false
  hostPath:
    data: "/tmp/starexec-data"
    postgres: "/tmp/postgres-data"

# ============================================================================
# POSTGRESQL CONFIGURATION
# ============================================================================
postgres:
  # Image configuration
  image:
    repository: docker.io/library/postgres
    pullPolicy: IfNotPresent
    tag: "15"

  # Connection configuration
  host: localhost
  port: 5432
  user: starexec
  database: starexec

  # Credentials - MUST be overridden via existingSecret in production
  # For development/testing, can be set directly (not recommended for prod)
  password: "starexec_dev_password" # Only set for dev/testing
  rootPassword: "starexec_dev_password" # Only set for dev/testing

  # External secret configuration (recommended for production)
  existingSecret: "" # If set, use this secret instead of creating one
  existingSecretKeys:
    user: "user"
    password: "password"
    database: "database"
    rootPassword: "rootPassword"

  # Persistence for PostgreSQL
  persistence:
    enabled: false
    storageClass: ""
    size: 20Gi

# ============================================================================
# KUBERNETES-SPECIFIC CONFIGURATION
# ============================================================================
kubernetes:
  enabled: true

  # Namespace for job execution. For the current Kubernetes-native backend,
  # this must match the Helm release namespace because the shared PVC and job
  # ServiceAccount are namespaced resources.
  jobNamespace: ""

  # Job runner configuration
  jobImage: "ghcr.io/starexecmiami/starexec-job-runner:latest"
  jobServiceAccount: ""

  # Data PVC for shared storage (required for kubernetes-native backend)
  dataPvc:
    name: ""
    existingClaim: ""
    storageClass: ""
    size: "100Gi"
    accessModes:
      - ReadWriteMany

  # Node selection and queue management
  nodeSelector:
    starexec.org/worker: "true"
  queueLabelKey: "starexec/queue"

  # Node management (requires ClusterRole)
  nodeManagement:
    enabled: false

  # Job resource limits
  resources:
    requests:
      memory: "512Mi"
      cpu: "1"
    limits:
      memory: "2Gi"
      cpu: "1"

  # Academic reproducibility mode:
  # enforce one job pair per CPU to reduce L1/L2 cache contention.
  strictOnePairPerCpu: true

  # Job lifecycle management
  ttlSecondsAfterFinished: 3600 # 1 hour
  backoffLimit: 0 # No retries - StarExec handles retry logic

# ============================================================================
# PODMAN-SPECIFIC CONFIGURATION
# ============================================================================
podman:
  # Container socket path for DooD (Docker-out-of-Docker)
  containerSocket:
    enabled: false
    # Rootless Podman socket only. Do not point this at a rootful system socket.
    # This placeholder is overridden by the Makefile during `make start` / Podman deploys.
    # If your socket lives elsewhere, export PODMAN_SOCKET_PATH or set the final hostPath
    # explicitly when invoking Helm directly.
    # See docs/TROUBLESHOOTING.md#podman-issues for remediation steps.
    hostPath: "/run/user/1000/podman/podman.sock"

  # Job container configuration
  jobImage: "ghcr.io/starexecmiami/starexec-job-runner:latest"

  # Hard cap on concurrently running Podman job containers.
  # Keep this at 1 to avoid L1/L2 cache contention between solver jobs.
  maxConcurrentJobs: 1

  # Network configuration for job containers
  networkMode: "starexec-net"
  jobDbHost: "postgres"

  # Path translation for job containers
  hostDataPath: ""

# ============================================================================
# SERVICE CONFIGURATION
# ============================================================================
service:
  type: ClusterIP # Options: ClusterIP, NodePort, LoadBalancer
  port: 8080
  targetPort: 8080
  nodePort: 30080 # Only used when type is NodePort

# ============================================================================
# EXTERNAL WEB URL
# ============================================================================
web:
  urlPrefix: "http"
  address: "localhost"
  proxyPort: 80

# ============================================================================
# SCALABILITY TUNING
# ============================================================================
scalability:
  # Maximum concurrent job pairs per node
  numJobPairsAtATime: 5
  # Virtual nodes per physical node (affects queue depth)
  nodeMultiplier: 16
  # Container status polling interval in milliseconds
  containerMonitorPollMs: 5000

# ============================================================================
# RESOURCE LIMITS
# ============================================================================
resources:
  app:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"
  postgres:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  migrations:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ============================================================================
# SECURITY / VOLUME PERMISSIONS
# ============================================================================
security:
  pod:
    supplementalGroups: []
  app:
    runAsUser: 1000
    runAsGroup: 999
  volumePermissions:
    enabled: true
    image: "busybox:1.36"

# ============================================================================
# DATABASE MIGRATIONS
# ============================================================================
migrations:
  enabled: true
  directory: "" # Optional: Override migration directory

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
env: {}

# ============================================================================
# INGRESS CONFIGURATION (Optional)
# ============================================================================
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: starexec.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ============================================================================
# MONITORING CONFIGURATION (Optional)
# ============================================================================
monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
