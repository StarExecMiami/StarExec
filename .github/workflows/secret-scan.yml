name: Secret Scanning

on:
  pull_request:
    branches: [UMprod, dev, containerised, fb1]
  push:
    branches: [UMprod, dev, containerised]
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8:00 AM UTC (offset from security-scan.yml at 6 AM)
  workflow_dispatch:

permissions:
  contents: read
  # Needed for gitleaks-action to post PR review comments and annotations
  pull-requests: write

jobs:
  gitleaks:
    name: Detect Hardcoded Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history is required so gitleaks can scan all commits
          # in the branch, not just the HEAD snapshot.
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          # Download and run gitleaks (no license required for public repos)
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source="." --config=.gitleaks.toml --verbose --report-format=sarif --report-path=results.sarif

      - name: Upload SARIF report
        # Upload findings to GitHub Security tab even if gitleaks exits non-zero.
        # This makes detections visible in the Code Scanning UI alongside CodeQL.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.sha }}
          path: results.sarif
          retention-days: 30
          if-no-files-found: ignore
