name: Maven Build & Test

on:
  push:
    branches: [UMprod, dev, main, containerised]
    paths:
      - "starexec-app/**"
      - "pom.xml"
      - ".github/workflows/maven-test.yml"
  pull_request:
    branches: [UMprod, dev, main, containerised]
    paths:
      - "starexec-app/**"
      - "pom.xml"
      # Without this, a PR that changes only this workflow gets no Maven
      # validation at all -- push.paths already lists it, pull_request.paths
      # did not.
      - ".github/workflows/maven-test.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Verify Java version
        run: java -version

      - name: Verify Maven version
        run: mvn -version

      - name: Run unit tests
        run: mvn clean test -pl starexec-app

      # Surefire matches **/*Test.java and **/*Tests.java, which do not match *IT.java,
      # so the step above runs none of the stored routines. Without this step the
      # StoredRoutineSmokeIT added for exactly that purpose never executed in CI.
      - name: Run stored-routine integration tests
        run: mvn verify -Pit -pl starexec-app -Dsurefire.skip=true

      - name: Assert the integration tests actually executed
        run: |
          # The IT calls assumeTrue and skips itself when no container runtime is
          # present. A skip must not read as a pass -- the whole point of this job is
          # to prove the stored routines really execute against a live PostgreSQL.
          report=starexec-app/target/failsafe-reports/org.starexec.test.integration.StoredRoutineSmokeIT.txt
          if [ ! -f "$report" ]; then
            echo "::error::No failsafe report at $report - the integration test never ran."
            ls -R starexec-app/target/failsafe-reports 2>/dev/null || echo "(no failsafe-reports directory)"
            exit 1
          fi
          cat "$report"
          run=$(sed -n 's/.*Tests run: \([0-9]*\).*/\1/p' "$report" | head -1)
          skipped=$(sed -n 's/.*Skipped: \([0-9]*\).*/\1/p' "$report" | head -1)
          if [ "${run:-0}" -eq 0 ]; then
            echo "::error::StoredRoutineSmokeIT reported 0 tests run."
            exit 1
          fi
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::StoredRoutineSmokeIT skipped ${skipped} test(s) - no container runtime? CI must execute them."
            exit 1
          fi
          echo "✓ StoredRoutineSmokeIT executed ${run} tests, 0 skipped"

      - name: Verify multi-module structure
        run: |
          echo "Verifying multi-module build structure..."
          [ -f pom.xml ] && echo "✓ Parent POM found"
          [ -f starexec-app/pom.xml ] && echo "✓ StarExec App module POM found"
          [ -d starexec-app/src/main/java ] && echo "✓ Production source directory found"
          [ -d starexec-app/src/test/java ] && echo "✓ Test source directory found"
          echo "✓ Multi-module structure verified"

      - name: Generate coverage report
        if: always()
        run: mvn jacoco:report -pl starexec-app || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: starexec-app/target/site/jacoco/
          retention-days: 7
          compression-level: 9

      - name: Comment PR with build summary
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Build summary information
            const comment = `## ✓ Maven Build Summary (Multi-Module)

            **Build Status:** ✅ Success

            **Modules Built:**
            - Parent POM (pom.xml)
            - StarExec App (starexec-app/)

            **Artifacts Generated:**
            - starexec-app/target/starexec.war - Web application archive

            **Verification Results:**
            - Multi-module structure: ✓
            - Parent POM: ✓
            - StarExec App module: ✓
            - WAR artifact: Standard Maven scope exclusion ✓

            **Coverage & Reports:**
            Available in [workflow artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  db-protocol-tests:
    name: DB Protocol Tests
    runs-on: ubuntu-latest

    # JobsRerunProtocolSqlTest and JobsKillProtocolSqlTest call
    # DatabaseTestSupport.assumeDatabaseAvailable in @BeforeClass, so without a reachable
    # PostgreSQL JUnit skips the entire class and Surefire still reports success. The
    # "Unit Tests" job above provisions no database, so before this job existed these two
    # classes executed zero tests in CI while holding the only executable proof of the
    # V0117 automatic-rerun transaction, its rollback behaviour, the manual-vs-automatic
    # and automatic-vs-automatic races, and the kill protocol.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: starexec
          POSTGRES_PASSWORD: ci_db_protocol_password
          POSTGRES_DB: starexec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starexec"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # The flyway-maven-plugin configuration interpolates ${starexec.db.*}, and no pom
      # defines those properties, so every flyway goal must be given them explicitly.
      # The schema Flyway targets is ${starexec.db.name}, i.e. "starexec" - not "public".
      - name: Apply migrations with Flyway
        run: |
          mvn -B flyway:migrate -pl starexec-app \
            -Dstarexec.db.host=localhost \
            -Dstarexec.db.name=starexec \
            -Dstarexec.db.user=starexec \
            -Dstarexec.db.password=ci_db_protocol_password

      - name: Run the DB-backed protocol suites
        env:
          STAREXEC_DB_URL: jdbc:postgresql://localhost:5432/starexec
          STAREXEC_DB_USER: starexec
          STAREXEC_DB_PASSWORD: ci_db_protocol_password
        run: |
          # This is deliberately an explicit allowlist, not a full DB-enabled run.
          # Widening it to the whole suite would pull in classes that leave pooled
          # connections in an aborted transaction, which poisons whichever DB class
          # surefire happens to schedule next and makes results order-dependent.
          # Add named classes here; do not replace this with a blanket run.
          mvn -B test -pl starexec-app \
            -Dtest=JobsRerunProtocolSqlTest,JobsKillProtocolSqlTest,UsersDeletionSqlRegressionTest,AuthenticatedUserStateLoaderTest,StaleSessionProcessorRevocationTest \
            -DfailIfNoTests=false

      - name: Assert the DB-backed suites actually executed
        run: |
          # A silent skip must never read as a pass. This mirrors the assertion the
          # StoredRoutineSmokeIT step above already applies, for the same reason.
          # Every class named in the -Dtest= allowlist above must appear here too:
          # these classes are gated by DatabaseTestSupport.assumeDatabaseAvailable,
          # so without the database they report "Tests run: 0" and the job would
          # otherwise go green having verified nothing.
          #
          # Classes are listed fully qualified. Surefire names each report after
          # the fully qualified class, and these suites no longer share a single
          # package, so a hardcoded package prefix would look for the security
          # classes under ...junit.database and silently find nothing.
          fail=0
          for fqcn in \
            org.starexec.test.junit.database.JobsRerunProtocolSqlTest \
            org.starexec.test.junit.database.JobsKillProtocolSqlTest \
            org.starexec.test.junit.database.UsersDeletionSqlRegressionTest \
            org.starexec.test.junit.security.AuthenticatedUserStateLoaderTest \
            org.starexec.test.junit.security.StaleSessionProcessorRevocationTest; do
            cls="${fqcn##*.}"
            report="starexec-app/target/surefire-reports/${fqcn}.txt"
            if [ ! -f "$report" ]; then
              echo "::error::No surefire report at $report - ${cls} never ran."
              fail=1
              continue
            fi
            run=$(grep -oP 'Tests run: \K[0-9]+' "$report" | head -1)
            skipped=$(grep -oP 'Skipped: \K[0-9]+' "$report" | head -1)
            run=${run:-0}
            skipped=${skipped:-0}
            if [ "$run" -eq 0 ]; then
              echo "::error::${cls} reported 0 tests run."
              fail=1
            elif [ "$skipped" -gt 0 ]; then
              echo "::error::${cls} skipped ${skipped} test(s) - the database must be reachable in CI."
              fail=1
            else
              echo "✓ ${cls} executed ${run} tests, 0 skipped"
            fi
          done
          exit $fail
