{{- /*
 Support three deployment modes:
 1. Podman with named volumes (usePodmanVolumes=true) - RECOMMENDED for local dev
 2. Podman with hostPath (useHostPathForPodman=true) - Legacy/debugging only
 3. Kubernetes Deployment with PVCs (default)
 
 Podman play kube requires Pod resource (not Deployment).
*/ -}}
{{- if or .Values.persistence.usePodmanVolumes .Values.persistence.useHostPathForPodman }}

apiVersion: v1
kind: Pod
metadata:
  name: {{ include "chart.name" . }}
  labels:
    app: {{ include "chart.name" . }}
spec:
  restartPolicy: Always
  volumes:
    - name: data
      {{- if .Values.persistence.usePodmanVolumes }}
      persistentVolumeClaim:
        claimName: {{ .Values.persistence.podmanVolumes.data.name | default "starexec-data" }}
      {{- else }}
      hostPath:
        path: /tmp/starexec-data
        type: DirectoryOrCreate
      {{- end }}
    - name: postgres-data
      {{- if and .Values.postgres.persistence.enabled .Values.persistence.usePodmanVolumes }}
      persistentVolumeClaim:
        claimName: {{ .Values.persistence.podmanVolumes.postgres.name | default "starexec-postgres" }}
      {{- else if .Values.persistence.useHostPathForPodman }}
      hostPath:
        path: /tmp/postgres-data
        type: DirectoryOrCreate
      {{- else }}
      emptyDir: {}
      {{- end }}
  containers:
    - name: app
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      ports:
        - containerPort: 8080
          hostPort: 7827
      env:
        - name: STAREXEC_DB_HOST
          value: {{ .Values.postgres.host | quote }}
        - name: STAREXEC_DB_PORT
          value: {{ .Values.postgres.port | quote }}
        - name: STAREXEC_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret | default (printf "%s-secret-postgres" (include "chart.name" .)) }}
              key: {{ .Values.postgres.existingSecretKeys.user | default "user" }}
        - name: STAREXEC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret | default (printf "%s-secret-postgres" (include "chart.name" .)) }}
              key: {{ .Values.postgres.existingSecretKeys.password | default "password" }}
        - name: STAREXEC_DB_NAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret | default (printf "%s-secret-postgres" (include "chart.name" .)) }}
              key: {{ .Values.postgres.existingSecretKeys.database | default "database" }}
        - name: STAREXEC_CLUSTER_DB_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret | default (printf "%s-secret-postgres" (include "chart.name" .)) }}
              key: {{ .Values.postgres.existingSecretKeys.user | default "user" }}
        - name: STAREXEC_CLUSTER_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret | default (printf "%s-secret-postgres" (include "chart.name" .)) }}
              key: {{ .Values.postgres.existingSecretKeys.password | default "password" }}
        - name: STAREXEC_REPORT_HOST
          value: {{ .Values.postgres.host | quote }}
        - name: STAREXEC_BACKEND_TYPE
          value: {{ .Values.backend.type | quote }}
        - name: STAREXEC_BACKEND_ROOT
          value: {{ .Values.backend.root | quote }}
        - name: STAREXEC_BACKEND_WORKING_DIR
          value: {{ .Values.backend.workingDir | quote }}
        - name: STAREXEC_DATA_DIR
          value: {{ .Values.dataDir | quote }}
        - name: STAREXEC_SANDBOX_DIR
          value: {{ .Values.sandboxDir | quote }}
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
      volumeMounts:
        - name: data
          mountPath: /app/data
      resources:
        {{- toYaml .Values.resources.app | nindent 8 }}

    - name: postgres
      image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
      imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
      ports:
        - containerPort: 5432
          hostPort: 5432
      env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret | default (printf "%s-secret-postgres" (include "chart.name" .)) }}
              key: {{ .Values.postgres.existingSecretKeys.database | default "database" }}
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret | default (printf "%s-secret-postgres" (include "chart.name" .)) }}
              key: {{ .Values.postgres.existingSecretKeys.user | default "user" }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.postgres.existingSecret | default (printf "%s-secret-postgres" (include "chart.name" .)) }}
              key: {{ .Values.postgres.existingSecretKeys.rootPassword | default "rootPassword" }}
        - name: LC_COLLATE
          value: "en_US.UTF-8"
        - name: LC_CTYPE
          value: "en_US.UTF-8"
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      resources:
        {{- toYaml .Values.resources.postgres | nindent 8 }}

{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "chart.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "chart.name" . }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 7827
          env:
            - name: STAREXEC_DB_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: STAREXEC_DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: STAREXEC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.name" . }}-secret-postgres
                  key: user
            - name: STAREXEC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.name" . }}-secret-postgres
                  key: password
            - name: STAREXEC_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.name" . }}-secret-postgres
                  key: database
            - name: STAREXEC_BACKEND_TYPE
              value: {{ .Values.backend.type | quote }}
            - name: STAREXEC_BACKEND_ROOT
              value: {{ .Values.backend.root | quote }}
            - name: STAREXEC_BACKEND_WORKING_DIR
              value: {{ .Values.backend.workingDir | quote }}
            - name: STAREXEC_DATA_DIR
              value: {{ $.Values.dataDir | quote }}
            - name: STAREXEC_SANDBOX_DIR
              value: {{ $.Values.sandboxDir | quote }}
            {{- range $key, $value := $.Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.name" . }}-secret-postgres
                  key: password
            - name: LC_COLLATE
              value: "en_US.UTF-8"
            - name: LC_CTYPE
              value: "en_US.UTF-8"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "chart.name" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: postgres-data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "chart.name" . }}-postgres-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}

{{- end }}
