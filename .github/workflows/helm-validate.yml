name: Helm Validation

on:
  push:
    branches: [UMprod, dev, containerised]
    paths:
      - "charts/**"
      - ".github/workflows/helm-validate.yml"
  pull_request:
    branches: [UMprod, dev, containerised]
    paths:
      - "charts/**"

permissions:
  contents: read

jobs:
  validate:
    name: Lint & Validate Helm Charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Verify Helm installation
        run: helm version

      - name: Lint Helm chart
        run: |
          echo "Linting Helm chart..."
          if [ -f "charts/starexec/values-dev.yaml" ]; then
            echo "Using values-dev.yaml for lint validation..."
            helm lint ./charts/starexec -f charts/starexec/values-dev.yaml --strict
          else
            echo "⚠️  values-dev.yaml not found, attempting default lint..."
            helm lint ./charts/starexec --strict
          fi

      - name: Validate chart templates
        run: |
          echo "Validating Helm templates for all environments..."
          for env in dev ci; do
            if [ -f "charts/starexec/values-$env.yaml" ]; then
              echo ""
              echo "=== Validating $env environment ==="
              helm template starexec ./charts/starexec \
                -f charts/starexec/values-$env.yaml \
                > /tmp/template-$env.yaml
              if [ $? -eq 0 ]; then
                LINES=$(wc -l < /tmp/template-$env.yaml)
                echo "✓ $env validation passed ($LINES lines generated)"
              else
                echo "✗ $env validation failed"
                exit 1
              fi
            else
              echo "⚠ values-$env.yaml not found, skipping"
            fi
          done

      - name: Check chart version
        id: chart-info
        run: |
          CHART_VERSION=$(helm show chart ./charts/starexec | grep '^version:' | awk '{print $2}')
          CHART_NAME=$(helm show chart ./charts/starexec | grep '^name:' | awk '{print $2}')
          CHART_APPVERSION=$(helm show chart ./charts/starexec | grep '^appVersion:' | awk '{print $2}')

          echo "chart-version=$CHART_VERSION" >> $GITHUB_OUTPUT
          echo "chart-name=$CHART_NAME" >> $GITHUB_OUTPUT
          echo "chart-appversion=$CHART_APPVERSION" >> $GITHUB_OUTPUT

          echo "Chart Information:"
          echo "  Name: $CHART_NAME"
          echo "  Version: $CHART_VERSION"
          echo "  App Version: $CHART_APPVERSION"

      - name: Generate Helm validation summary
        if: success()
        run: |
          echo "## Helm Chart Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart Name:** \`${{ steps.chart-info.outputs.chart-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Chart Version:** \`${{ steps.chart-info.outputs.chart-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**App Version:** \`${{ steps.chart-info.outputs.chart-appversion }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Chart lint: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Template validation: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Environment templates: Generated successfully" >> $GITHUB_STEP_SUMMARY

      - name: Upload rendered templates as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helm-templates-${{ github.sha }}
          path: /tmp/template-*.yaml
          retention-days: 7
