name: StarExec K8s Deploy

# =============================================================================
# GitHub Actions Workflow: Deploy StarExec to Kubernetes
# =============================================================================
#
# Deploys the StarExec application to a real Kubernetes cluster using Helm.
# This workflow is designed to be:
#   - Environment-aware (dev / staging / prod)
#   - Triggered after successful container image publication
#   - Secure (no cluster credentials in code)
#   - Idempotent (helm upgrade --install)
#
# Triggers:
#   - workflow_run: After container-publish.yml completes successfully
#   - workflow_dispatch: Manual deployment with environment selection
#   - push: On main/default branch (auto-deploy dev)
#
# Prerequisites in the target cluster:
#   1. Worker nodes labeled: starexec.org/worker=true
#   2. A StorageClass supporting ReadWriteMany (for multi-node) or
#      ReadWriteOnce (for single-node)
#   3. PostgreSQL 15 (external or deployed by the chart)
#   4. Pre-created namespace: starexec
#   5. A Kubernetes secret with DB credentials:
#      kubectl create secret generic starexec-postgres-credentials \
#        --namespace starexec \
#        --from-literal=user=starexec \
#        --from-literal=password=$(openssl rand -base64 32) \
#        --from-literal=database=starexec \
#        --from-literal=rootPassword=$(openssl rand -base64 32)
#
# =============================================================================

on:
  # ---------------------------------------------------------------
  # Automatic: trigger after container images are published
  # ---------------------------------------------------------------
  workflow_run:
    workflows:
      - "Container Publish"
      - "Job Runner Publish"
    types:
      - completed
    branches:
      - containerised
      - main

  # ---------------------------------------------------------------
  # Manual trigger for controlled deployments
  # ---------------------------------------------------------------
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Kubernetes environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: "Container image tag to deploy (default: latest)"
        required: false
        default: "latest"
        type: string
      job_runner_tag:
        description: "Job runner image tag (default: latest)"
        required: false
        default: "latest"
        type: string
      helm_version:
        description: "Helm chart version or path"
        required: false
        default: "./charts/starexec"
        type: string

  # ---------------------------------------------------------------
  # Push to default branch → auto-deploy to dev
  # ---------------------------------------------------------------
  push:
    branches:
      - main
      - containerised
    paths:
      - "charts/**"
      - ".github/workflows/deploy-k8s.yml"

# ============================================================================
# Permissions
# ============================================================================
permissions:
  contents: read
  id-token: write  # Needed for OIDC-based cloud authentication

# ============================================================================
# Environment-level configuration
# ============================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ghcr.io/starexecmiami/starexec
  JOB_RUNNER_IMAGE: ghcr.io/starexecmiami/starexec-job-runner
  HELM_CHART_PATH: ./charts/starexec
  # Determined dynamically below
  DEPLOY_ENV: ""
  VALUES_FILE: ""
  K8S_NAMESPACE: ""
  IMAGE_TAG: ""
  JOB_RUNNER_TAG: ""

jobs:
  # ==========================================================================
  # Determine deployment target from context
  # ==========================================================================
  resolve-environment:
    name: Resolve Deployment Target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      values_file: ${{ steps.resolve.outputs.values_file }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      job_runner_tag: ${{ steps.resolve.outputs.job_runner_tag }}

    steps:
      - name: Resolve environment from trigger context
        id: resolve
        run: |
          # Defaults
          ENV="dev"
          VALUES="charts/starexec/values-auto-detected.yaml"
          NS="starexec-dev"
          IMG_TAG="latest"
          JR_TAG="latest"

          # ------------------------------------------------------------------
          # Priority 1: workflow_dispatch with explicit environment
          # ------------------------------------------------------------------
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            IMG_TAG="${{ github.event.inputs.image_tag }}"
            JR_TAG="${{ github.event.inputs.job_runner_tag }}"

          # ------------------------------------------------------------------
          # Priority 2: triggered by container-publish — use branch context
          # ------------------------------------------------------------------
          elif [ "${{ github.event_name }}" == "workflow_run" ]; then
            # Infer from triggering branch
            TRIGGER_BRANCH="${{ github.event.workflow_run.head_branch }}"
            echo "Triggered by workflow_run on branch: $TRIGGER_BRANCH"

            case "$TRIGGER_BRANCH" in
              containerised|main)
                ENV="dev"
                ;;
              staging)
                ENV="staging"
                ;;
              prod*)
                ENV="prod"
                ;;
            esac

            # Use the SHA of the triggering commit as the image tag
            IMG_TAG="${{ github.event.workflow_run.head_sha }}"

          # ------------------------------------------------------------------
          # Priority 3: direct push to branch
          # ------------------------------------------------------------------
          elif [ "${{ github.event_name }}" == "push" ]; then
            REF="${{ github.ref_name }}"
            case "$REF" in
              main|containerised)
                ENV="dev"
                IMG_TAG="${{ github.sha }}"
                ;;
            esac
          fi

          # ------------------------------------------------------------------
          # Map environment → values file + namespace
          # ------------------------------------------------------------------
          case "$ENV" in
            dev)
              VALUES="charts/starexec/values-auto-detected.yaml"
              NS="starexec-dev"
              ;;
            staging)
              VALUES="charts/starexec/values-kubernetes.yaml"
              NS="starexec-staging"
              ;;
            prod)
              VALUES="charts/starexec/values-kubernetes.yaml"
              NS="starexec-prod"
              ;;
          esac

          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "values_file=$VALUES" >> $GITHUB_OUTPUT
          echo "namespace=$NS" >> $GITHUB_OUTPUT
          echo "image_tag=$IMG_TAG" >> $GITHUB_OUTPUT
          echo "job_runner_tag=$JR_TAG" >> $GITHUB_OUTPUT

          echo ""
          echo "=== RESOLVED DEPLOYMENT TARGET ==="
          echo "Environment:    $ENV"
          echo "Namespace:      $NS"
          echo "Values File:    $VALUES"
          echo "Image Tag:      $IMG_TAG"
          echo "Job Runner Tag: $JR_TAG"
          echo "=================================="

  # ==========================================================================
  # Validate: confirm prerequisites before deploying
  # ==========================================================================
  validate:
    name: Validate Prerequisites
    needs: [resolve-environment]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    outputs:
      image_exists: ${{ steps.check-image.outputs.exists }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate container image exists in registry
        id: check-image
        env:
          IMAGE_TAG: ${{ needs.resolve-environment.outputs.image_tag }}
        run: |
          TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:${{ github.repository }}:pull" \
            | jq -r '.token')

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://ghcr.io/v2/${{ github.repository }}/manifests/$IMAGE_TAG")

          if [ "$HTTP_CODE" == "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Image ${{ env.REGISTRY }}/${{ github.repository }}:$IMAGE_TAG exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  Image ${{ env.REGISTRY }}/${{ github.repository }}:$IMAGE_TAG not found (HTTP $HTTP_CODE)"
            echo "Will fall back to 'latest' tag"
          fi

      - name: Validate Helm chart
        run: |
          helm lint ${{ env.HELM_CHART_PATH }} \
            -f ${{ needs.resolve-environment.outputs.values_file }} --strict
          echo "✅ Helm chart lint passed"

      - name: Validate kubectl access
        env:
          KUBECONFIG: ${{ secrets[format('KUBECONFIG_{0}', needs.resolve-environment.outputs.environment)] }}
        if: env.KUBECONFIG != ''
        run: |
          echo "$KUBECONFIG" > /tmp/kubeconfig
          KUBECONFIG=/tmp/kubeconfig kubectl cluster-info
          echo "✅ Cluster access validated"

      - name: Validate required secrets exist in cluster
        env:
          KUBECONFIG_SECRET: ${{ secrets[format('KUBECONFIG_{0}', needs.resolve-environment.outputs.environment)] }}
          NAMESPACE: ${{ needs.resolve-environment.outputs.namespace }}
        if: env.KUBECONFIG_SECRET != ''
        run: |
          echo "$KUBECONFIG_SECRET" > /tmp/kubeconfig
          KUBECONFIG=/tmp/kubeconfig kubectl get secret \
            --namespace "$NAMESPACE" starexec-postgres-credentials \
            && echo "✅ Database secret exists" \
            || echo "⚠️  Secret 'starexec-postgres-credentials' not found in namespace $NAMESPACE — will be created by Helm from GitHub Secrets"

      - name: Generate validation summary
        if: always()
        run: |
          echo "## ✅ Pre-deployment Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ format('`{0}`', needs.resolve-environment.outputs.environment) }}" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** ${{ format('`{0}`', needs.resolve-environment.outputs.namespace) }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ format('`{0}`', steps.check-image.outputs.exists == 'true' && needs.resolve-environment.outputs.image_tag || 'latest (fallback)') }}" >> $GITHUB_STEP_SUMMARY
          echo "**Values File:** ${{ format('`{0}`', needs.resolve-environment.outputs.values_file) }}" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # StarExec K8s Deploy
  # ==========================================================================
  deploy:
    name: Deploy StarExec
    needs: [resolve-environment, validate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve-environment.outputs.environment }}
      url: ${{ steps.deploy-url.outputs.url }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # ------------------------------------------------------------------
      # Install kubeconfig from GitHub Environment Secret
      # ------------------------------------------------------------------
      # Each environment (dev/staging/prod) stores its own kubeconfig
      # as a repository environment secret named:
      #   KUBECONFIG_DEV
      #   KUBECONFIG_STAGING
      #   KUBECONFIG_PROD
      #
      # The kubeconfig should be a base64-encoded, minimal-context config
      # with a dedicated, least-privilege service account token.
      # ------------------------------------------------------------------
      - name: Configure kubectl
        id: kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets[format('KUBECONFIG_{0}', needs.resolve-environment.outputs.environment)] }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::Missing KUBECONFIG_$(echo ${{ needs.resolve-environment.outputs.environment }} | tr '[:lower:]' '[:upper:]') secret"
            echo "Create it in: Settings → Environments → ${{ needs.resolve-environment.outputs.environment }}"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "✅ kubeconfig installed for environment: ${{ needs.resolve-environment.outputs.environment }}"

      # ------------------------------------------------------------------
      # Create namespace if it doesn't exist
      # ------------------------------------------------------------------
      - name: Ensure namespace exists
        run: |
          kubectl create namespace "${{ needs.resolve-environment.outputs.namespace }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Namespace '${{ needs.resolve-environment.outputs.namespace }}' ready"

      # ------------------------------------------------------------------
      # Provision or reuse database credentials secret
      # ------------------------------------------------------------------
      - name: Ensure database credentials secret
        env:
          DB_USER: ${{ secrets[format('DB_USER_{0}', needs.resolve-environment.outputs.environment)] }}
          DB_PASSWORD: ${{ secrets[format('DB_PASSWORD_{0}', needs.resolve-environment.outputs.environment)] }}
          DB_NAME: ${{ secrets[format('DB_NAME_{0}', needs.resolve-environment.outputs.environment)] }}
          DB_ROOT_PASSWORD: ${{ secrets[format('DB_ROOT_PASSWORD_{0}', needs.resolve-environment.outputs.environment)] }}
          NAMESPACE: ${{ needs.resolve-environment.outputs.namespace }}
        run: |
          # Use values from GitHub Secrets, or generate secure random ones
          # for ephemeral environments
          kubectl create secret generic starexec-postgres-credentials \
            --namespace "$NAMESPACE" \
            --from-literal=user="${DB_USER:-starexec}" \
            --from-literal=password="${DB_PASSWORD:-$(openssl rand -base64 32)}" \
            --from-literal=database="${DB_NAME:-starexec}" \
            --from-literal=rootPassword="${DB_ROOT_PASSWORD:-$(openssl rand -base64 32)}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ Database secret ensured in namespace '$NAMESPACE'"

      # ------------------------------------------------------------------
      # Resolve the effective image tag
      # ------------------------------------------------------------------
      - name: Determine image tag
        id: image-tag
        env:
          IMAGE_TAG: ${{ needs.resolve-environment.outputs.image_tag }}
          VALIDATED: ${{ needs.validate.outputs.image_exists }}
        run: |
          if [ "$VALIDATED" == "true" ]; then
            echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # Render Helm template for review (dry-run)
      # ------------------------------------------------------------------
      - name: Render Helm template
        id: template
        run: |
          helm template starexec ${{ env.HELM_CHART_PATH }} \
            --namespace "${{ needs.resolve-environment.outputs.namespace }}" \
            -f "${{ needs.resolve-environment.outputs.values_file }}" \
            --set image.tag="${{ steps.image-tag.outputs.tag }}" \
            --set kubernetes.jobImage="${{ env.JOB_RUNNER_IMAGE }}:${{ needs.resolve-environment.outputs.job_runner_tag }}" \
            > /tmp/rendered-manifest.yaml
          echo "✅ Template rendered ($(wc -l < /tmp/rendered-manifest.yaml) lines)"

      # ------------------------------------------------------------------
      # Deploy with Helm
      # ------------------------------------------------------------------
      - name: Deploy with Helm
        id: deploy
        run: |
          RELEASE_NAME="starexec"

          echo "=== DEPLOYING STAREXEC ==="
          echo "Release:      $RELEASE_NAME"
          echo "Namespace:    ${{ needs.resolve-environment.outputs.namespace }}"
          echo "Values:       ${{ needs.resolve-environment.outputs.values_file }}"
          echo "Image Tag:    ${{ steps.image-tag.outputs.tag }}"
          echo "Job Runner:   ${{ env.JOB_RUNNER_IMAGE }}:${{ needs.resolve-environment.outputs.job_runner_tag }}"
          echo "=========================="

          helm upgrade --install "$RELEASE_NAME" "${{ env.HELM_CHART_PATH }}" \
            --namespace "${{ needs.resolve-environment.outputs.namespace }}" \
            --create-namespace \
            -f "${{ needs.resolve-environment.outputs.values_file }}" \
            --set image.tag="${{ steps.image-tag.outputs.tag }}" \
            --set kubernetes.jobImage="${{ env.JOB_RUNNER_IMAGE }}:${{ needs.resolve-environment.outputs.job_runner_tag }}" \
            --set postgres.host="${{ secrets[format('DB_HOST_{0}', needs.resolve-environment.outputs.environment)] || 'postgres.starexec.svc.cluster.local' }}" \
            --set ingress.enabled="${{ needs.resolve-environment.outputs.environment == 'prod' && 'true' || 'false' }}" \
            --set monitoring.enabled="${{ needs.resolve-environment.outputs.environment == 'prod' && 'true' || 'false' }}" \
            --wait \
            --timeout 10m \
            --atomic

          echo "✅ Helm deployment successful"

      # ------------------------------------------------------------------
      # Verify deployment status
      # ------------------------------------------------------------------
      - name: Verify deployment
        id: verify
        run: |
          NAMESPACE="${{ needs.resolve-environment.outputs.namespace }}"

          echo "=== DEPLOYMENT STATUS ==="
          kubectl -n "$NAMESPACE" get pods -o wide
          echo ""
          kubectl -n "$NAMESPACE" get svc
          echo ""

          # Wait for rollout to complete
          kubectl -n "$NAMESPACE" rollout status deployment/starexec --timeout=5m

          # Check pod readiness
          READY_PODS=$(kubectl -n "$NAMESPACE" get pods \
            -l app.kubernetes.io/name=starexec \
            -o jsonpath='{.items[*].status.containerStatuses[*].ready}' | tr ' ' '\n' | grep -c "true" || true)
          TOTAL_PODS=$(kubectl -n "$NAMESPACE" get pods \
            -l app.kubernetes.io/name=starexec \
            -o jsonpath='{.items[*].status.containerStatuses[*].ready}' | wc -w || true)

          echo "$READY_PODS/$TOTAL_PODS containers ready"

          if [ "$READY_PODS" -lt "$TOTAL_PODS" ]; then
            echo "::warning::Not all containers are ready ($READY_PODS/$TOTAL_PODS)"
          fi

      # ------------------------------------------------------------------
      # Run smoke tests against the deployed instance
      # ------------------------------------------------------------------
      - name: Run smoke tests
        id: smoke
        continue-on-error: true
        run: |
          NAMESPACE="${{ needs.resolve-environment.outputs.namespace }}"

          # Get service endpoint
          SVC_NAME="starexec"
          SVC_PORT=$(kubectl -n "$NAMESPACE" get svc "$SVC_NAME" \
            -o jsonpath='{.spec.ports[0].port}')
          echo "Service port: $SVC_PORT"

          # Port-forward to test locally
          kubectl -n "$NAMESPACE" port-forward svc/"$SVC_NAME" 8080:8080 &
          PF_PID=$!
          sleep 5

          # Test 1: Application root responds
          echo "=== Smoke Test 1: Application Root ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            http://localhost:8080/starexec/ || echo "000")
          echo "HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "302" ] || [ "$HTTP_CODE" == "401" ]; then
            echo "✅ App is responding"
          else
            echo "❌ App did not respond as expected"
            kill $PF_PID 2>/dev/null || true
            exit 1
          fi

          # Test 2: Health endpoint (if available)
          echo "=== Smoke Test 2: Health Check ==="
          HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            http://localhost:8080/starexec/healthz || echo "000")
          echo "Health endpoint: HTTP $HEALTH_CODE"

          # Test 3: Check Flyway migration status
          echo "=== Smoke Test 3: Database Migration Check ==="
          FLYWAY_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 \
            http://localhost:8080/starexec/migration-status || echo "000")
          echo "Migration status: HTTP $FLYWAY_CODE"

          kill $PF_PID 2>/dev/null || true
          echo "✅ All smoke tests passed"

      # ------------------------------------------------------------------
      # Notify on success
      # ------------------------------------------------------------------
      - name: Generate deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ format('`{0}`', needs.resolve-environment.outputs.environment) }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | ${{ format('`{0}`', needs.resolve-environment.outputs.namespace) }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | ${{ format('`{0}`', steps.image-tag.outputs.tag) }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Job Runner | ${{ format('`{0}:{1}`', env.JOB_RUNNER_IMAGE, needs.resolve-environment.outputs.job_runner_tag) }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment | \`starexec\` (Helm release) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.verify.conclusion == 'success' && '✅' || '❌' }} Pod rollout verification" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ steps.smoke.conclusion == 'success' && '✅' || '❌' }} Smoke tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add kubectl commands for reference
          echo "### Quick References" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# View pods" >> $GITHUB_STEP_SUMMARY
          echo "kubectl -n ${{ needs.resolve-environment.outputs.namespace }} get pods" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# View logs" >> $GITHUB_STEP_SUMMARY
          echo "kubectl -n ${{ needs.resolve-environment.outputs.namespace }} logs -l app.kubernetes.io/name=starexec -c app" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Connect to database" >> $GITHUB_STEP_SUMMARY
          echo "kubectl -n ${{ needs.resolve-environment.outputs.namespace }} exec -it deploy/starexec -c postgres -- psql -U starexec" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------------
      # Rollback on failure (automatic with --atomic, but provide info)
      # ------------------------------------------------------------------
      - name: Capture rollback details on failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Helm was deployed with \`--atomic\` which auto-rolls back on failure." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debug commands" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Check pod status" >> $GITHUB_STEP_SUMMARY
          echo "kubectl -n ${{ needs.resolve-environment.outputs.namespace }} get pods" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# View application logs" >> $GITHUB_STEP_SUMMARY
          echo "kubectl -n ${{ needs.resolve-environment.outputs.namespace }} logs -l app.kubernetes.io/name=starexec --tail=100" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Describe deployment" >> $GITHUB_STEP_SUMMARY
          echo "kubectl -n ${{ needs.resolve-environment.outputs.namespace }} describe deploy/starexec" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Attach deployment metadata to GitHub
  # ==========================================================================
  record-deployment:
    name: Record Deployment
    needs: [resolve-environment, deploy]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      statuses: write

    steps:
      - name: Create deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const env = '${{ needs.resolve-environment.outputs.environment }}';
            const namespace = '${{ needs.resolve-environment.outputs.namespace }}';

            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: env,
              auto_merge: false,
              required_contexts: [],
              description: `Deployed ${env} to namespace ${namespace}`
            }).catch(err => console.log('Deployment record exists:', err.message));
