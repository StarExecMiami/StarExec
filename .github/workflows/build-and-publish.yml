# GitHub Actions CI/CD Pipeline for StarExec

name: StarExec CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [UMprod, dev, containerised]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [UMprod, dev, containerised]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run unit tests
        run: mvn test
      
      - name: Build and test with Docker Compose
        env:
          STAREXEC_DB_PASSWORD: ci_test_password
          STRICT_DB_CONNECTION: true
        run: |
          docker compose up -d --build
          docker compose ps
      
      - name: Wait for application
        run: |
          echo "Waiting for application to start..."
          timeout 180 bash -c 'until curl -f http://localhost:8080/starexec/ 2>/dev/null; do sleep 5; echo "Still waiting..."; done'
          echo "✓ Application is ready"
      
      - name: Check application logs if startup failed
        if: failure()
        run: |
          echo "Application failed to start. Checking logs..."
          docker compose logs starexec
          docker compose ps
      
      - name: Run integration tests
        run: |
          curl -f http://localhost:8080/starexec/ || exit 1

      - name: Build and push image
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME=$(echo 'ghcr.io/${{ github.repository_owner }}/starexec' | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${REGISTRY} -u "${{ github.actor }}" --password-stdin
          
          # Docker Compose creates image name from directory: starexec-starexec:latest
          COMPOSE_IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep starexec | head -1)
          echo "Found image: $COMPOSE_IMAGE"
          
          # Always tag with commit SHA (immutable reference)
          docker tag $COMPOSE_IMAGE ${IMAGE_NAME}:${{ github.sha }}
          docker push ${IMAGE_NAME}:${{ github.sha }}
          
          # Tag with branch name (mutable, points to latest commit in branch)
          BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
          docker tag ${IMAGE_NAME}:${{ github.sha }} ${IMAGE_NAME}:${BRANCH_NAME}
          docker push ${IMAGE_NAME}:${BRANCH_NAME}
          
          # Only tag "latest" for production branch (containerised)
          if [ "${BRANCH_NAME}" = "containerised" ]; then
            docker tag ${IMAGE_NAME}:${{ github.sha }} ${IMAGE_NAME}:latest
            docker push ${IMAGE_NAME}:latest
            echo "✓ Pushed to latest (production branch)"
          fi
      
      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs
      
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

  helm-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      
      - name: Lint Helm charts
        run: |
          helm lint ./chart
          for env in dev ci; do
            echo "Validating $env environment..."
            helm template starexec ./chart -f chart/values-$env.yaml > /dev/null
          done

