{{- if and (eq (include "starexec.isKubernetesBackend" .) "true") .Values.kubernetes.jobNamespace (ne .Values.kubernetes.jobNamespace .Release.Namespace) -}}
{{- fail (printf "kubernetes.jobNamespace (%s) must match the Helm release namespace (%s) because the Kubernetes-native backend mounts a namespaced shared PVC and uses a namespaced ServiceAccount" .Values.kubernetes.jobNamespace .Release.Namespace) -}}
{{- end }}
{{- if ne (int .Values.replicaCount) 1 -}}
{{- fail (printf "replicaCount (%v) must remain 1 because StarExec currently supports only a single application replica" .Values.replicaCount) -}}
{{- end }}
{{- if and (eq .Values.postgres.host "localhost") (ne (int .Values.postgres.port) 5432) -}}
{{- fail (printf "postgres.port (%v) must remain 5432 when postgres.host=localhost because the embedded PostgreSQL sidecar listens on 5432" .Values.postgres.port) -}}
{{- end }}
{{- if and (eq (include "starexec.isKubernetesBackend" .) "true") (lt (int .Values.kubernetes.maxConcurrentJobs) 1) -}}
{{- fail (printf "kubernetes.maxConcurrentJobs (%v) must be >= 1" .Values.kubernetes.maxConcurrentJobs) -}}
{{- end }}
{{- if and (eq (include "starexec.isKubernetesBackend" .) "true") (lt (int .Values.kubernetes.orphanSweepIntervalMs) 0) -}}
{{- fail (printf "kubernetes.orphanSweepIntervalMs (%v) must be >= 0" .Values.kubernetes.orphanSweepIntervalMs) -}}
{{- end }}
{{- if and (eq (include "starexec.isKubernetesBackend" .) "true") (or (eq .Values.kubernetes.workerSelectorKey "") (eq .Values.kubernetes.workerSelectorValue "")) -}}
{{- fail "kubernetes.workerSelectorKey and kubernetes.workerSelectorValue must be non-empty for Kubernetes-native backend" -}}
{{- end }}
{{- $k8sDataPvcAccessMode := "ReadWriteMany" -}}
{{- if and (eq (include "starexec.isKubernetesBackend" .) "true") .Values.kubernetes.dataPvc.accessModes -}}
{{- $k8sDataPvcAccessMode = first .Values.kubernetes.dataPvc.accessModes -}}
{{- end -}}
{{- $embeddedPostgres := eq (include "starexec.usesEmbeddedPostgres" .) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
{{- if $embeddedPostgres }}
  strategy:
    type: Recreate
{{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
{{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
{{- if eq .Values.backend.type "podman" }}
      annotations:
        io.podman.annotations.userns: "keep-id"
{{- end }}
    spec:
      serviceAccountName: {{ include "chart.fullname" . }}
      restartPolicy: Always
{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
{{- else if and (eq (include "starexec.isKubernetesBackend" .) "true") (or (eq $k8sDataPvcAccessMode "ReadWriteOnce") (eq $k8sDataPvcAccessMode "ReadWriteOncePod")) }}
      nodeSelector:
{{ toYaml .Values.kubernetes.nodeSelector | indent 8 }}
{{- end }}
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
{{- if .Values.security.pod.supplementalGroups }}
        supplementalGroups:
{{ toYaml .Values.security.pod.supplementalGroups | indent 10 }}
{{- end }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: {{ .Values.security.volumePermissions.image | quote }}
          # Required, not optional tuning: a namespace with a ResourceQuota that
          # sets requests/limits rejects any pod containing a container that
          # declares neither. Without this the whole Deployment is refused with
          # "must specify limits.cpu for: fix-permissions", and under the
          # Recreate strategy the old pod is already gone by then.
          resources:
{{ toYaml .Values.security.volumePermissions.resources | indent 12 }}
          command:
            - sh
            - -c
            - |
              echo "Ensuring directories exist and permissions are correct..."
              mkdir -p /app/data /app/sandbox /app/backend /app/work
{{- if $embeddedPostgres }}
              mkdir -p /var/lib/postgresql/data
{{- end }}
{{- if .Values.security.volumePermissions.enabled }}
              chown -R {{ .Values.security.app.runAsUser }}:{{ .Values.security.app.runAsGroup }} /app/data /app/sandbox /app/backend /app/work
{{- if $embeddedPostgres }}
              chown -R 999:999 /var/lib/postgresql/data
{{- end }}
              chmod 0770 /app/data /app/sandbox /app/backend /app/work
{{- if $embeddedPostgres }}
              chmod 0700 /var/lib/postgresql/data
{{- end }}
{{- else }}
              echo "Volume permission fixups disabled; only creating directories"
{{- end }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: sandbox
              mountPath: /app/sandbox
            - name: backend
              mountPath: /app/backend
            - name: work
              mountPath: /app/work
{{- if $embeddedPostgres }}
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
{{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
{{- if eq (include "starexec.isKubernetesBackend" .) "true" }}
            claimName: {{ default (include "starexec.k8sDataPvcName" .) .Values.kubernetes.dataPvc.existingClaim }}
{{- else }}
            claimName: {{ default (include "starexec.volumeName" (list . "data")) .Values.persistence.existingClaims.data }}
{{- end }}
        - name: sandbox
          persistentVolumeClaim:
            claimName: {{ default (include "starexec.volumeName" (list . "sandbox")) .Values.persistence.existingClaims.sandbox }}
        - name: backend
          persistentVolumeClaim:
            claimName: {{ default (include "starexec.volumeName" (list . "backend")) .Values.persistence.existingClaims.backend }}
        - name: work
          persistentVolumeClaim:
            claimName: {{ default (include "starexec.volumeName" (list . "work")) .Values.persistence.existingClaims.work }}
{{- if $embeddedPostgres }}
        - name: postgres-data
{{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "starexec.volumeName" (list . "postgres")) .Values.persistence.existingClaims.postgres }}
{{- else }}
          emptyDir: {}
{{- end }}
{{- end }}
        - name: tmp
          emptyDir: {}
{{- if and (eq .Values.backend.type "podman") .Values.podman.containerSocket.enabled }}
        - name: podman-socket
          hostPath:
            path: {{ required "podman.containerSocket.hostPath is required when containerSocket.enabled=true" .Values.podman.containerSocket.hostPath | quote }}
            type: Socket
{{- end }}
      containers:
        - name: app
          image: "{{ include "starexec.appImage" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
             - name: http
               containerPort: 8080
{{- if eq .Values.backend.type "podman" }}
               hostPort: 7827
{{- end }}
          env:
            - name: STAREXEC_DB_HOST
              value: "{{ .Values.postgres.host }}"
            - name: STAREXEC_DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: STAREXEC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretKeys.user }}
            - name: STAREXEC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretKeys.password }}
            - name: STAREXEC_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretKeys.database }}
            - name: STAREXEC_CLUSTER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretKeys.user }}
            - name: STAREXEC_CLUSTER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretKeys.password }}
            - name: STAREXEC_REPORT_HOST
              value: "localhost"
            - name: STAREXEC_BACKEND_TYPE
              value: "{{ .Values.backend.type }}"
            - name: STAREXEC_BACKEND_ROOT
              value: "/app/backend"
            - name: STAREXEC_BACKEND_WORKING_DIR
              value: "/app/work"
{{- if and (eq .Values.backend.type "podman") .Values.backend.networkMode }}
            - name: STAREXEC_CONTAINER_NETWORK_MODE
              value: "{{ .Values.backend.networkMode }}"
{{- end }}
{{- if and (eq .Values.backend.type "podman") .Values.podman.containerSocket.enabled }}
            - name: STAREXEC_CONTAINER_SOCKET
              value: "unix:///run/podman/podman.sock"
            - name: STAREXEC_CONTAINER_JOB_IMAGE
              value: "{{ .Values.podman.jobImage }}"
{{- end }}
{{- if eq .Values.backend.type "podman" }}
            - name: STAREXEC_CONTAINER_MAX_CONCURRENT_JOBS
              value: "{{ .Values.podman.maxConcurrentJobs }}"
{{- end }}
{{- if eq (include "starexec.isKubernetesBackend" .) "true" }}
            - name: STAREXEC_K8S_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: STAREXEC_K8S_JOB_IMAGE
              value: "{{ .Values.kubernetes.jobImage }}"
            - name: STAREXEC_K8S_DATA_PVC
              value: {{ include "starexec.k8sDataPvcName" . | quote }}
            - name: STAREXEC_K8S_DATA_PVC_ACCESS_MODE
              value: "{{ $k8sDataPvcAccessMode }}"
            - name: STAREXEC_K8S_SERVICE_ACCOUNT
              value: {{ include "starexec.k8sJobServiceAccount" . | quote }}
            - name: STAREXEC_K8S_APP_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: STAREXEC_K8S_QUEUE_LABEL
              value: "{{ .Values.kubernetes.queueLabelKey }}"
            - name: STAREXEC_K8S_JOB_TTL_SECONDS
              value: "{{ .Values.kubernetes.ttlSecondsAfterFinished }}"
            - name: STAREXEC_K8S_JOB_BACKOFF_LIMIT
              value: "{{ .Values.kubernetes.backoffLimit }}"
            - name: STAREXEC_K8S_MAX_CONCURRENT_JOBS
              value: "{{ .Values.kubernetes.maxConcurrentJobs }}"
            - name: STAREXEC_K8S_ORPHAN_SWEEP_INTERVAL_MS
              value: "{{ .Values.kubernetes.orphanSweepIntervalMs }}"
            - name: STAREXEC_K8S_MEMORY_LIMIT
              value: "{{ .Values.kubernetes.resources.limits.memory }}"
            - name: STAREXEC_K8S_CPU_LIMIT
              value: "{{ .Values.kubernetes.resources.limits.cpu }}"
            - name: STAREXEC_K8S_STRICT_ONE_PAIR_PER_CPU
              value: "{{ .Values.kubernetes.strictOnePairPerCpu }}"
            - name: STAREXEC_NUM_JOB_PAIRS_AT_A_TIME
              value: "{{ .Values.scalability.numJobPairsAtATime }}"
            - name: STAREXEC_NODE_MULTIPLIER
              value: "{{ .Values.scalability.nodeMultiplier }}"
            - name: STAREXEC_K8S_WORKER_SELECTOR_KEY
              value: {{ default "starexec.org/worker" .Values.kubernetes.workerSelectorKey | quote }}
            - name: STAREXEC_K8S_WORKER_SELECTOR_VALUE
              value: {{ default "true" .Values.kubernetes.workerSelectorValue | quote }}
{{- end }}
{{- if .Values.backend.hostDataPath }}
            - name: STAREXEC_CONTAINER_HOST_DATA_PATH
              value: {{ .Values.backend.hostDataPath | quote }}
            - name: STAREXEC_CONTAINER_DATA_PATH
              value: "/app/data"
{{- end }}
            - name: STAREXEC_DATA_DIR
              value: "/app/data"
            - name: STAREXEC_SANDBOX_DIR
              value: "/app/sandbox"
            - name: STAREXEC_LOCAL_CONCURRENCY
              value: "{{ .Values.backend.local.concurrency }}"
            - name: STAREXEC_LOCAL_FORCE_SANDBOX
              value: "{{ .Values.backend.local.forceSandbox }}"
            - name: STAREXEC_LOCAL_USE_RUNSOLVER
              value: "{{ .Values.backend.local.useRunsolver }}"
            - name: STAREXEC_LOCAL_GRACEFUL_SHUTDOWN_SECONDS
              value: "{{ .Values.backend.local.gracefulShutdownSeconds }}"
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: STAREXEC_URL_PREFIX
              value: {{ .Values.web.urlPrefix | quote }}
            - name: STAREXEC_WEB_ADDRESS
              value: {{ .Values.web.address | quote }}
            - name: STAREXEC_PROXY_PORT
              value: {{ .Values.web.proxyPort | quote }}
            - name: SKIP_MIGRATIONS
{{- if $embeddedPostgres }}
              value: "false"
{{- else }}
              value: "{{ if .Values.migrations.enabled }}true{{ else }}false{{ end }}"
{{- end }}
{{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
          securityContext:
            runAsUser: {{ .Values.security.app.runAsUser }}
            runAsGroup: {{ .Values.security.app.runAsGroup }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: sandbox
              mountPath: /app/sandbox
            - name: backend
              mountPath: /app/backend
            - name: work
              mountPath: /app/work
            - name: tmp
              mountPath: /tmp
{{- if and (eq .Values.backend.type "podman") .Values.podman.containerSocket.enabled }}
            - name: podman-socket
              mountPath: /run/podman/podman.sock
{{- end }}
          resources:
{{ toYaml .Values.resources.app | indent 12 }}
          # Liveness asks only whether the process still serves. It must not
          # check the database: restarting cannot fix a database, so a DB-aware
          # liveness probe turns an outage into a restart storm.
          livenessProbe:
            httpGet:
              path: /starexec/public/health/liveness
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # Readiness asks whether this instance can serve usefully, which means
          # reaching the database. replicaCount is pinned to 1 above, so this
          # cannot shift traffic to a peer; its job is to refuse cutover to a new
          # pod that cannot reach the database during a rollout.
          # 3 x 10s absorbs a blip before the endpoint is withdrawn.
          readinessProbe:
            httpGet:
              path: /starexec/public/health/readiness
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
{{- if $embeddedPostgres }}
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretKeys.database }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretKeys.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: {{ .Values.postgres.existingSecretKeys.password }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
          resources:
{{ toYaml .Values.resources.postgres | indent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U starexec
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
{{- end }}
