name: Publish Helm Chart Repository

on:
  push:
    branches: [ containerised, main, master ]
    paths:
      - 'charts/**'
      - '.github/workflows/helm-repo.yml'
      - '.github/helm-landing-page.html'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.1

      # Retains every previously published chart package and index entry.
      # See scripts/helm-repo-prepare.sh for why this replaced a bare
      # `helm package` + `helm repo index` (which silently dropped old versions).
      - name: Build repository, retaining published chart versions
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          ./scripts/helm-repo-prepare.sh \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            ./helm-repo \
            ./published-index.yaml

      # Derived from Chart.yaml and the published index, so it keeps working
      # when the chart version moves. The previous form asserted the literals
      # `0.1.0 0.2.0`, which would have had to be hand-edited every release --
      # and would have quietly stopped protecting anything if it were not.
      - name: Verify old chart versions were retained
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          ./scripts/check-helm-retention.py \
            --repo-dir ./helm-repo \
            --chart charts/starexec/Chart.yaml \
            --old-index ./published-index.yaml

      - name: Add landing page
        run: cp .github/helm-landing-page.html ./helm-repo/index.html

      # keep_files preserves anything already on gh-pages that this run did not
      # rebuild. force_orphan was removed: it recreated the branch from scratch,
      # which is what destroyed previously published .tgz files.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./helm-repo
          keep_files: true
