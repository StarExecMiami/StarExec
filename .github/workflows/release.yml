# =============================================================================
# GitHub Actions Workflow: Application Release
# =============================================================================
#
# Publishes a GitHub Release for an application tag.
#
# Trigger is deliberately limited to the vX.Y.Z application-release convention.
# The previous "release-*" trigger was removed because the tag-to-version guard
# below can never accept it, so it could only ever produce a failed run.
#
# Order matters: every cheap guard (tag/version agreement, release-notes
# completeness) runs BEFORE the Maven build, and asset verification runs before
# publication. There is no path on which a GitHub Release is created after a
# failed version check, notes check, artifact build, or asset check.
#
# The release body is the curated, reviewed file docs/release-notes/v<version>.md.
# It is NOT generated from `git log` and NOT GitHub's auto-generated notes: the
# previous inline body interpolated an unreliable commit range and asserted
# "Security scans: Passed" / "Container validation: Passed", which this workflow
# does not verify.
# =============================================================================

name: Release Management

on:
  push:
    tags:
      - "v*"

permissions:
  # contents: write — create the release and upload assets.
  contents: write
  # issues: write — required by the failure-notification step below, which opens
  # an issue when a release build fails. Nothing else here needs it.
  issues: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      # ---- Guards: cheap, and before anything expensive ------------------
      - name: Verify tag matches the Maven project version
        run: ./scripts/check-release-version.sh "${{ github.ref_name }}"

      - name: Verify cumulative release notes
        run: ./scripts/check-release-notes.sh "docs/release-notes/${{ github.ref_name }}.md"

      # ---- Build ---------------------------------------------------------
      - name: Build release artifacts
        run: mvn clean install -DskipTests -Dmaven.test.skip=true -pl starexec-app -B

      - name: Verify artifacts and generate SHA256SUMS
        run: ./scripts/check-release-assets.sh starexec-app/target

      # ---- Publish -------------------------------------------------------
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          tag_name: ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            starexec-app/target/starexec.war
            starexec-app/target/starexeccommand.zip
            starexec-app/target/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            starexec-app/target/starexec.war
            starexec-app/target/starexeccommand.zip
            starexec-app/target/SHA256SUMS
          retention-days: 90

      - name: Job summary
        run: |
          {
            echo "## Release published"
            echo ""
            echo "**Tag:** \`${{ github.ref_name }}\`"
            echo "**Notes:** \`docs/release-notes/${{ github.ref_name }}.md\`"
            echo ""
            echo "### Assets"
            echo '```'
            cat starexec-app/target/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on release failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${{ github.ref_name }} - Build Failed`,
              body: `The release build for tag \`${{ github.ref_name }}\` failed. Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`,
              labels: ['bug', 'release']
            });
