# =============================================================================
# GitHub Actions Workflow: Container Build, Test, Scan, and Publish
# =============================================================================
#
# Single workflow replaces the previous container-build + container-publish split.
# On push: builds, tests, scans, and pushes to ghcr.io.
# On PR:   builds, tests, scans — does NOT push.
#
# This eliminates the redundant double-build that previously occurred when both
# container-build.yml and container-publish.yml triggered on the same push event.
#
# Triggers:
#   - push: to containerised/UMprod
#   - pull_request: same branches and relevant paths — test-only, no push
#   - workflow_dispatch: manual execution
#
# Consumers:
#   - Jenkins deploys the exact published image to quokka MicroK8s.
#   - integration-test.yml should pull the published image from ghcr.io.
#
# =============================================================================

name: Container Publish

on:
  push:
    branches: [UMprod, containerised]
  pull_request:
    branches: [UMprod, containerised]
    paths:
      - "starexec-app/**"
      - "tomcat-credential-handler/**"
      - "Dockerfile"
      - "docker/**"
      - "scripts/GetComputerInfo"
      - "pom.xml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/container-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: starexecmiami/starexec

jobs:
  validate:
    name: Build, Test & Scan
    runs-on: ubuntu-latest
    outputs:
      image_tags: ${{ steps.meta.outputs.tags }}
    env:
      LOCAL_IMAGE_TAG: starexec-ci:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # ------------------------------------------------------------------
      # ------------------------------------------------------------------
      # Metadata extraction (produces tags for push; PR gets test-only tag)
      # ------------------------------------------------------------------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # {{branch}} is empty on pull_request, where the ref is
          # refs/pull/<N>/merge and there is no branch context. The two
          # {{branch}}-prefixed sha rules therefore rendered a bare "-" prefix
          # and produced ghcr.io/.../starexec:-<sha>, which buildx rejects as an
          # invalid reference before the build starts. They were also duplicates
          # of each other: format=short is the default. One rule survives, gated
          # to non-PR events; PRs get their own ref-derived tags below.
          tags: |
            type=sha,prefix=sha-,format=long
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=pr,suffix=-{{sha}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/containerised' }}

      - name: Capture build timestamp
        id: build-metadata
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Build and load locally. Publishing is allowed only after validation.
      # ------------------------------------------------------------------
      - name: Build container image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.LOCAL_IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.build-metadata.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      # ------------------------------------------------------------------
      # Container validation (runs on every build — PR and push)
      # ------------------------------------------------------------------
      - name: Validate container structure
        run: |
          echo "Validating image: ${LOCAL_IMAGE_TAG}"

          # Java installation
          docker run --rm "${LOCAL_IMAGE_TAG}" java -version
          echo "✓ Java runtime OK"

          # Multi-module Maven structure
          docker run --rm "${LOCAL_IMAGE_TAG}" sh -c \
            'test -d /opt/tomcat/webapps/starexec && echo "✓ Maven multi-module structure OK"'

          # Image metadata
          docker inspect "${LOCAL_IMAGE_TAG}" | jq '.[0] | {Size, Created, Architecture: .Architecture, Os: .Os}'

      # ------------------------------------------------------------------
      # Security scan gates publication on all push and pull-request builds.
      # ------------------------------------------------------------------
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.LOCAL_IMAGE_TAG }}"
          format: "table"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Generate Trivy SARIF report
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.LOCAL_IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-results.sarif"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy SARIF report
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-container-${{ github.sha }}
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Export validated image
        if: success()
        run: docker save "$LOCAL_IMAGE_TAG" --output validated-image.tar

      - name: Upload validated image
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-image-${{ github.sha }}
          path: validated-image.tar
          if-no-files-found: error
          retention-days: 1

  upload-sarif:
    name: Publish Trivy SARIF
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ always() && needs.validate.result != 'cancelled' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download Trivy SARIF report
        id: download-sarif
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trivy-container-${{ github.sha }}

      - name: Check for Trivy SARIF report
        id: sarif
        run: |
          if [ -s trivy-results.sarif ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Trivy scan results
        if: steps.sarif.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

  publish:
    name: Publish Validated Image
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name != 'pull_request' && needs.validate.result == 'success' }}
    permissions:
      contents: read
      packages: write
    env:
      LOCAL_IMAGE_TAG: starexec-ci:${{ github.sha }}
      IMAGE_TAGS: ${{ needs.validate.outputs.image_tags }}
      BRANCH_NAME: ${{ github.ref_name }}
      COMMIT_SHA: ${{ github.sha }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Download validated image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-image-${{ github.sha }}

      - name: Load validated image
        run: docker load --input validated-image.tar

      # ------------------------------------------------------------------
      # Publish only after the validation job succeeds.
      # ------------------------------------------------------------------
      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated image
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker tag "$LOCAL_IMAGE_TAG" "$tag"
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"

      # ------------------------------------------------------------------
      # Summary
      # ------------------------------------------------------------------
      - name: Generate build summary
        if: always()
        run: |
          {
              echo "## 📦 Container Image — Published"
              echo ""
              echo "| Property | Value |"
              echo "|----------|-------|"
              echo "| Branch | \`$BRANCH_NAME\` |"
              echo "| Commit | \`$COMMIT_SHA\` |"
              echo "| Event | $EVENT_NAME |"
              echo "| Registry | \`$REGISTRY\` |"
              echo "| Repository | \`$IMAGE_NAME\` |"
              echo ""
            echo "### Tags"
            echo '```'
              printf '%s\n' "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
