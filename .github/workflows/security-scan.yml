name: Security Scanning

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC
  pull_request:
    branches: [UMprod, dev, containerised, fb1]
    paths:
      - 'starexec-app/**'
      - 'pom.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'dependency-check-suppressions.xml'
      - '.github/npm-audit-exceptions.json'
      - '.github/scripts/npm_audit_gate.py'
      - '.github/workflows/security-scan.yml'
  push:
    branches: [UMprod, dev, containerised, fb1]
    paths:
      - 'pom.xml'
      - 'package.json'
      - 'package-lock.json'
      - 'dependency-check-suppressions.xml'
      - '.github/npm-audit-exceptions.json'
      - '.github/scripts/npm_audit_gate.py'
      - 'starexec-app/**'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

# A burst of merges used to start one full scan per merge, all refreshing the
# NVD database at once. The newest commit contains the older ones, so a newer
# run on the same ref supersedes any run still in progress. The event name keeps
# a push from cancelling the weekly scheduled scan.
concurrency:
  group: security-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    env:
      DC_DATA_DIR: ${{ github.workspace }}/target/dependency-check-data
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Every npm package here is a devDependency, jQuery included, which does ship, so the
      # audit cannot simply omit dev dependencies. npm audit cannot set one advisory aside
      # either; the gate fails on high and critical advisories except the documented ones in
      # .github/npm-audit-exceptions.json, each only while it is build tooling, unfixed and
      # inside its review date.
      #
      # continue-on-error, so a failure here no longer skips the OWASP scan of the Java
      # dependencies below (it did from 2026-10-14 on). The job still fails at the end.
      - name: Audit Node build dependencies
        id: npm-audit
        continue-on-error: true
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_npm_audit_gate.py'
          npm audit --package-lock-only --json > npm-audit.json || true
          python3 .github/scripts/npm_audit_gate.py npm-audit.json package-lock.json .github/npm-audit-exceptions.json
      
      # Daily, not weekly: a cache key cannot be overwritten, so with a weekly key
      # every run re-downloaded all NVD changes since the first save of the week.
      - name: Set Dependency-Check cache key
        run: echo "CACHE_EPOCH=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Restore Dependency-Check database
        id: dependency-check-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: ${{ runner.os }}-dependency-check-v2-${{ env.CACHE_EPOCH }}
          # A prior day's cache is only an update input. The strict update
          # step below must succeed before the vulnerability scan can run.
          restore-keys: |
            ${{ runner.os }}-dependency-check-v2-

      - name: Update Dependency-Check database
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p "$DC_DATA_DIR"
          NVD_KEY_OPTION=()
          if [ -n "${NVD_API_KEY}" ]; then
            NVD_KEY_OPTION=(-DnvdApiKeyEnvironmentVariable=NVD_API_KEY)
          else
            # Respect the NVD unauthenticated rate limit during a cold cache
            # bootstrap. Subsequent runs restore the persisted database.
            NVD_KEY_OPTION=(-DnvdApiDelay=10000 -DnvdMaxRetryCount=10)
          fi
          mvn -B dependency-check:update-only \
            -DnvdValidForHours=24 \
            -DfailOnError=true \
            "${NVD_KEY_OPTION[@]}"

      - name: Run OWASP Dependency Check
        run: |
          mvn -B dependency-check:aggregate \
            -DautoUpdate=false \
            -DfailOnError=true \
            -DfailBuildOnCVSS=7 \
            -DskipProvidedScope=true \
            -DskipRuntimeScope=false \
            -DskipTestScope=true \
            -DnodePackageSkipDevDependencies=true \
            -DnodeAuditSkipDevDependencies=true

      - name: Save Dependency-Check database
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.DC_DATA_DIR }}
          key: ${{ steps.dependency-check-cache.outputs.cache-primary-key }}
      
      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report-${{ github.sha }}
          path: |
            **/target/dependency-check-report.*
          retention-days: 30

      # The Node audit above continues on error so the Java scan always runs; the job must
      # still fail when it did.
      - name: Fail on the Node audit
        if: ${{ steps.npm-audit.outcome == 'failure' }}
        run: |
          echo "::error::The Node dependency audit failed; see its step above. The Java scan ran regardless."
          exit 1
      
  sast-scan:
    name: SAST Analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: ['java']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build project for analysis
        run: |
          echo "Building project for CodeQL analysis..."
          mvn clean package -DskipTests -q
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          category: '/language:${{ matrix.language }}'
      
  license-inventory:
    name: License Inventory (Informational)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Generate license inventory
        run: |
          echo "Generating an informational Maven dependency license inventory..."
          mvn -B license:add-third-party
      
      - name: Upload license inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-inventory-${{ github.sha }}
          path: |
            starexec-app/target/generated-sources/license/THIRD-PARTY.txt
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast-scan, license-inventory]
    if: always()
    
    steps:
      - name: Generate security report summary
        env:
          DEPENDENCY_SCAN_RESULT: ${{ needs.dependency-scan.result }}
          SAST_SCAN_RESULT: ${{ needs.sast-scan.result }}
          LICENSE_INVENTORY_RESULT: ${{ needs.license-inventory.result }}
        run: |
          {
            echo "## 🔒 Security Scanning Results"
            echo ""
            echo "### Job Results"
            echo "| Scan | Result |"
            echo "|------|--------|"
            echo "| Dependency Vulnerability Scan (OWASP) | ${DEPENDENCY_SCAN_RESULT} |"
            echo "| Static Analysis (CodeQL) | ${SAST_SCAN_RESULT} |"
            echo "| License Inventory (informational) | ${LICENSE_INVENTORY_RESULT} |"
            echo ""
            echo "### Report Access"
            echo "- View detailed results in the **Security** tab"
            echo "- Download artifacts from workflow run"
            echo ""
            echo "### Schedule"
            echo "- **Regular:** Weekly on Mondays at 6:00 AM UTC"
            echo "- **On Demand:** Triggered by pull requests and supported-branch POM changes"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DEPENDENCY_SCAN_RESULT" != "success" ] || [ "$SAST_SCAN_RESULT" != "success" ]; then
            echo "A required security scan failed" >&2
            exit 1
          fi
