# Kubernetes development values for quokka.
#
# This profile is for the Jenkins/dev namespace on quokka's MicroK8s cluster.
# Local Podman development lives in values-local-dev.yaml.

image:
  repository: ghcr.io/starexecmiami/starexec
  # Manual deployments that keep `latest` should leave pullPolicy at Always.
  # CI/CD overrides tag and pullPolicy with a unique per-build tag + IfNotPresent.
  tag: latest
  pullPolicy: Always

replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: quokka

postgres:
  image:
    repository: docker.io/library/postgres
    tag: "15"
    pullPolicy: IfNotPresent
  host: localhost
  port: 5432
  user: starexec
  database: starexec
  existingSecret: starexec-postgres-credentials
  existingSecretKeys:
    user: user
    password: password
    database: database
    rootPassword: rootPassword
  persistence:
    enabled: false

backend:
  type: kubernetes

kubernetes:
  jobNamespace: starexec-dev
  jobImage: ghcr.io/starexecmiami/starexec-job-runner:latest
  # Always, because this profile deliberately tracks a mutable ":latest" and a developer
  # who pushes a new job-runner expects the next pair to run it.
  #
  # Written out because this key used to be inert -- nothing read it -- so it had no
  # bearing on behaviour, and Kubernetes derived Always from the ":latest" tag anyway.
  # Now that the value is wired through to the pod, leaving the previous IfNotPresent here
  # would quietly pin development to whatever image each node happened to cache.
  jobImagePullPolicy: Always
  jobServiceAccount: starexec-job
  # Because dataPvc uses ReadWriteOnce (microk8s-hostpath pinned to quokka),
  # KubernetesNativeBackend binds job pods directly via spec.nodeName=quokka
  # (8 CPUs / 64GiB allocatable, ~5.8 CPUs free beside app/system pods),
  # bypassing kube-scheduler queuing. Keep legacy static mode (slotsPerNode: 0,
  # maxConcurrentJobs <= 4) and per-job limits at integer 1 CPU (required by
  # strictOnePairPerCpu=true) / 2Gi so kubelet on quokka never rejects
  # concurrent E2E pods with OutOfcpu.
  slotsPerNode: 0
  queueBuffer: 0
  maxConcurrentJobs: 4
  nodeSelector:
    starexec.org/worker: "true"
  dataPvc:
    accessModes:
      - ReadWriteOnce
  resources:
    # KubernetesNativeBackend always creates Guaranteed QoS pods with
    # requests == limits from STAREXEC_K8S_{CPU,MEMORY}_LIMIT.
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

persistence:
  enabled: true
  storageClass: microk8s-hostpath
  appDataSize: 10Gi
  backendSize: 5Gi
  sandboxSize: 5Gi
  workSize: 5Gi
  postgresDataSize: 20Gi

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30081

ingress:
  enabled: false

monitoring:
  enabled: false

resources:
  app:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

web:
  address: "localhost"
  urlPrefix: "http"
  proxyPort: 30081
