name: Maven Build & Test

on:
  push:
    branches: [UMprod, dev, main, containerised]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/maven-test.yml'
  pull_request:
    branches: [UMprod, dev, main, containerised]
    paths:
      - 'src/**'
      - 'pom.xml'

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Verify Java version
        run: java -version
      
      - name: Verify Maven version
        run: mvn -version
      
      - name: Run unit tests
        run: mvn clean test
      
      - name: Generate coverage report
        if: always()
        run: mvn jacoco:report
      
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: target/site/jacoco/
          retention-days: 7
          compression-level: 9
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: target/surefire-reports/
          retention-days: 7
      
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            target/surefire-reports/**/*.xml
          check_name: Unit Test Results
          compare_to_earlier_commit: true
      
      - name: Comment PR with test summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Count test files
            const testReportsDir = 'target/surefire-reports';
            if (fs.existsSync(testReportsDir)) {
              const files = fs.readdirSync(testReportsDir).filter(f => f.endsWith('.xml'));
              const comment = `## ✓ Maven Build & Test Results\n\n**Test Report Files:** ${files.length}\n\n- Coverage report: [View Coverage](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n- Test artifacts: Available in workflow artifacts`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
