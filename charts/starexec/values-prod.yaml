# Production environment values for the canonical quokka deployment.
#
# This file is the base production profile. Jenkins and manual Helm invocations
# targeting production should use this file; Jenkins overlays deploy-time image references.

image:
  repository: ghcr.io/starexecmiami/starexec
  # Manual deployments that keep `latest` should leave pullPolicy at Always.
  # CI/CD overrides tag and pullPolicy with a unique per-build tag + IfNotPresent.
  tag: latest
  pullPolicy: Always

replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: quokka

postgres:
  image:
    repository: docker.io/library/postgres
    tag: "15"
    pullPolicy: IfNotPresent
  host: localhost
  port: 5432
  user: starexec
  database: starexec
  existingSecret: starexec-postgres-credentials
  existingSecretKeys:
    user: user
    password: password
    database: database
    rootPassword: rootPassword
  persistence:
    enabled: true
    storageClass: starexec-nfs-rwo
    size: 20Gi
  # PGDATA already exists on the persistent volume, so runtime GUC tuning is passed as container args.
  extraArgs:
    - "-c"
    - "shared_buffers=1GB"
    - "-c"
    - "effective_cache_size=3GB"
    - "-c"
    - "work_mem=16MB"
    - "-c"
    - "maintenance_work_mem=256MB"
    - "-c"
    - "jit=off"
    - "-c"
    - "max_parallel_workers_per_gather=1"

backend:
  type: kubernetes

kubernetes:
  jobNamespace: starexec
  # Immutable linux/amd64 manifest digest, not a tag.
  #
  # The compute nodes are isolated from the public registry and receive this image by
  # cluster-local side-load, so the reference has to name bytes that are already resident
  # rather than something to fetch. A tag cannot do that: ":latest" is mutable, and
  # Kubernetes derives Always as the pull policy from it, which asks isolated nodes to
  # reach a registry they cannot see.
  #
  # This pin previously lived only as a live Helm override while the chart default stayed
  # ":latest", so an upgrade whose values omitted it silently reverted the reference.
  # Recording it here is what stops that from recurring.
  #
  # sha256:63ae82d5... is the linux/amd64 manifest inside index sha256:b3b08512...,
  # built from StarExec revision faccd0aac917a9ce54d68dabd2e664a49beaaf18.
  # Deliberately the platform manifest and not the index digest, because that is the form
  # the workers' side-load was validated against.
  jobImage: ghcr.io/starexecmiami/starexec-job-runner@sha256:63ae82d539f7c26bc70f42036f968897fc110416043d2fedc8a917b828537cdd
  jobImagePullPolicy: IfNotPresent
  jobServiceAccount: starexec-job
  # Dynamic concurrency for in-flight StarExec Kubernetes Jobs:
  # effective cap = activeSchedulableWorkerNodes * slotsPerNode + queueBuffer.
  # With 5 workers (n021..n025) this yields 5 * 2 + 30 = 40; scaling to
  # 25 workers (n001..n025) automatically scales up to 25 * 2 + 30 = 80
  # without Helm edits or Tomcat restarts. maxConcurrentJobs=0 disables any
  # static ceiling when dynamic mode is active.
  slotsPerNode: 2
  queueBuffer: 30
  maxConcurrentJobs: 0
  nodeSelector:
    starexec.org/worker: "true"
  # Opt-in node qualification label for strict CPU mode. Leave empty when all
  # n021..n025 workers already enforce cpuManagerPolicy=static + full-pcpus-only.
  strictCpuNodeLabel: ""
  dataPvc:
    existingClaim: starexec-data-rwx
    name: starexec-data-rwx
    storageClass: starexec-nfs-rwx
    size: 100Gi
    accessModes:
      - ReadWriteMany
  resources:
    # Job pods request exactly these limits. KubernetesNativeBackend sets requests equal to
    # limits (Guaranteed QoS, which static cpuManagerPolicy + full-pcpus-only requires for
    # exclusive cores), and no template reads a separate requests block.
    # Sized for 2 pairs per worker on dual-socket 32-thread / ~249GiB-allocatable nodes
    # (n021..n025 with topologyManagerPolicy=single-numa-node and kube-reserved=cpu=2,memory=2Gi):
    # - cpu: "14" = 7 full physical SMT cores (even thread count required by full-pcpus-only=true)
    #   pinned cleanly to a single NUMA socket per pod (28/30 allocatable CPUs, leaving 2 for system).
    # - memory: "120Gi" = 240Gi per node, leaving headroom below ~249GiB allocatable to avoid OOM/evictions.
    # - 40 queued pods fit inside starexec-quota (560/640 CPU, 4800Gi/5120Gi memory + app overhead).
    limits:
      cpu: "14"
      memory: "120Gi"

persistence:
  enabled: true
  storageClass: starexec-nfs-rwo
  appDataSize: 100Gi
  backendSize: 5Gi
  sandboxSize: 5Gi
  workSize: 5Gi
  postgresDataSize: 20Gi
  existingClaims:
    data: starexec-data-rwx
    backend: starexec-backend-rwo
    sandbox: starexec-sandbox-rwo
    work: starexec-work-rwo
    postgres: starexec-postgres-rwo

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30080

ingress:
  enabled: false

monitoring:
  enabled: false

resources:
  app:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  postgres:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2"

web:
  address: "quokka.acorn.miami.edu"
  urlPrefix: "https"
  proxyPort: 443
  secureCookies: true

uploads:
  extractionTimeoutSeconds: 3600
  extractionMaxUncompressedBytes: "107374182400"
  sessionChunkSizeBytes: 8388608
  tmpSizeLimit: "10Gi"
  stagingSizeLimit: "20Gi"

env:
  STAREXEC_EMAIL_SMTP: "mailgw.as.acorn.miami.edu"
  STAREXEC_EMAIL_PORT: "25"
  STAREXEC_EMAIL_FROM: "starexec@quokka.acorn.miami.edu"
