{{- if and .Values.persistence.enabled (not .Values.persistence.usePodmanVolumes) (not .Values.persistence.useHostPathForPodman) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chart.name" . }}-pvc
  labels:
    app: {{ include "chart.name" . }}
    component: app-data
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}

{{- if and .Values.mysql.persistence.enabled (not .Values.persistence.usePodmanVolumes) (not .Values.persistence.useHostPathForPodman) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "chart.name" . }}-mysql-pvc
  labels:
    app: {{ include "chart.name" . }}
    component: mysql-data
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.mysql.persistence.storageClass }}
  storageClassName: {{ .Values.mysql.persistence.storageClass | default .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mysql.persistence.size | default "20Gi" }}
{{- end }}
