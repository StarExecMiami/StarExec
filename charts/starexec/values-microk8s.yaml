# MicroK8s development environment values
# Usage: helm template starexec ./charts/starexec -f ./charts/starexec/values-microk8s.yaml

deploymentMode: microk8s

image:
  repository: ghcr.io/starexecmiami/starexec
  tag: latest
  pullPolicy: IfNotPresent

persistence:
  hostPath:
    data: "/tmp/starexec-data"
    postgres: "/tmp/postgres-data"

postgres:
  password: starexec_dev_password
  rootPassword: starexec_dev_password

backend:
  type: "local"

env:
  SKIP_MIGRATIONS: "true"