name: Publish Helm Chart Repository

on:
  push:
    branches: [ containerised, main, master ]
    paths:
      - 'charts/**'
      - '.github/workflows/helm-repo.yml'
      - '.github/helm-landing-page.html'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.1

      - name: Build and package charts
        run: |
          mkdir -p ./helm-repo
          helm package charts/* --destination ./helm-repo

      - name: Generate index
        run: |
          helm repo index ./helm-repo --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Add landing page
        run: cp .github/helm-landing-page.html ./helm-repo/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./helm-repo
          force_orphan: true
