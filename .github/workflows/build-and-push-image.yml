# StarExec Docker Image Build and Push Workflow
#
# This workflow enforces architectural best practices:
#   1. Immutable image tags (never :latest)
#   2. Build verification (migrations packaged correctly)
#   3. Security scanning
#   4. Proper credential handling
#
# Triggered on:
#   - Push to main branch (production builds)
#   - Pull requests (verification builds, not pushed)
#   - Manual dispatch (emergency builds)

name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'starexec-app/**'
      - '.github/workflows/build-and-push-image.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'starexec-app/**'
  workflow_dispatch:
    inputs:
      registry:
        description: 'Container registry (docker.io, ghcr.io, etc)'
        required: false
        default: 'ghcr.io'

env:
  REGISTRY: ${{ github.event.inputs.registry || 'ghcr.io' }}
  IMAGE_NAME: ${{ github.repository_owner }}/starexec

jobs:
  # Job 1: Verify migrations are properly packaged
  verify-migrations:
    name: Verify Migrations Packaged
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build application WAR
        run: |
          cd starexec-app
          mvn clean package -DskipTests -B -q

      - name: Verify migration files in source
        run: |
          MIGRATION_DIR="starexec-app/src/main/resources/db/migration"
          SOURCE_COUNT=$(find "$MIGRATION_DIR" -maxdepth 1 -type f -name "*.sql" 2>/dev/null | wc -l)

          echo "Source migration files: $SOURCE_COUNT"
          if [ "$SOURCE_COUNT" -lt 20 ]; then
            echo "❌ FAILED: Expected at least 20 migration files, found $SOURCE_COUNT"
            exit 1
          fi
          echo "✅ PASSED: Migration source files verified"

      - name: Verify migrations in WAR
        run: |
          WAR_FILE="starexec-app/target/starexec.war"
          WAR_COUNT=$(unzip -l "$WAR_FILE" 2>/dev/null | grep -c "WEB-INF/classes/db/migration" || echo 0)

          echo "WAR migration entries: $WAR_COUNT"
          if [ "$WAR_COUNT" -lt 20 ]; then
            echo "❌ FAILED: Expected at least 20 migration entries in WAR, found $WAR_COUNT"
            exit 1
          fi
          echo "✅ PASSED: Migrations packaged in WAR correctly"

      - name: List packaged migrations
        run: |
          WAR_FILE="starexec-app/target/starexec.war"
          echo "Packaged migration files:"
          unzip -l "$WAR_FILE" 2>/dev/null | grep "WEB-INF/classes/db/migration.*\.sql$" | awk '{print $NF}'

      - name: Generate build artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-verification
          path: starexec-app/target/starexec.war
          retention-days: 1

  # Job 2: Build Docker image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: verify-migrations
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          # Determine version tag based on git state
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Production build: use commit SHA + timestamp
            COMMIT_SHA=${{ github.sha }}
            SHORT_SHA=${COMMIT_SHA:0:8}
            BUILD_DATE=$(date -u +'%Y%m%d')
            VERSION="${BUILD_DATE}-${SHORT_SHA}"
            IS_PROD="true"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            # Development build: use commit SHA
            COMMIT_SHA=${{ github.sha }}
            SHORT_SHA=${COMMIT_SHA:0:8}
            VERSION="dev-${SHORT_SHA}"
            IS_PROD="false"
          else
            # PR or manual: use branch name + commit SHA
            BRANCH=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}
            SHORT_SHA=${COMMIT_SHA:0:8}
            VERSION="${BRANCH}-${SHORT_SHA}"
            IS_PROD="false"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "is_prod=${IS_PROD}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

          echo "📦 Image version: $VERSION"
          echo "🔗 Commit SHA: $SHORT_SHA"
          echo "🏭 Production build: $IS_PROD"

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ steps.meta.outputs.short_sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image coordinates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "## ✅ Docker Image Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version Tag:** ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** ${{ steps.meta.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull Image:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "export STAREXEC_VERSION=${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "docker compose up -d" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Output for PR
        if: github.event_name == 'pull_request'
        run: |
          echo "## 🔨 Build Verification for PR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "**Migrations Verified:** ✅ Packaged correctly" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image:** Built (not pushed to registry)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This build is ready for review. When merged to \`main\`, it will be pushed to the registry." >> $GITHUB_STEP_SUMMARY

  # Job 3: Security scanning (optional, requires paid GitHub Advanced Security)
  scan-vulnerabilities:
    name: Scan for Vulnerabilities
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'starexec-app'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 4: Generate deployment instructions
  deployment-guide:
    name: Generate Deployment Guide
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate deployment instructions
        id: deploy-guide
        run: |
          COMMIT_SHA=${{ github.sha }}
          SHORT_SHA=${COMMIT_SHA:0:8}
          BUILD_DATE=$(date -u +'%Y%m%d')
          VERSION="${BUILD_DATE}-${SHORT_SHA}"

          cat > deployment-guide.md << 'EOF'
          # StarExec Deployment Guide

          ## Quick Start

          ```bash
          # 1. Set the image version (immutable tag)
          export STAREXEC_VERSION=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:VERSION_PLACEHOLDER

          # 2. Set database credentials
          export STAREXEC_DB_PASSWORD="your-strong-password"

          # 3. Start with migrations
          docker compose -f docker-compose.yml -f docker-compose.migrations.yml up -d

          # 4. Monitor migration progress
          docker compose logs -f migrations

          # 5. Verify application is running
          curl http://localhost:8080/starexec/
          ```

          ## Verification Steps

          ```bash
          # Check all services are healthy
          docker compose ps

          # Verify migrations completed
          docker compose logs migrations | grep -i "successfully applied"

          # Check database
          docker compose exec postgres psql -U starexec -d starexec \
            -c "SELECT COUNT(*) as migrations_applied FROM flyway_schema_history;"
          ```

          ## Important Notes

          - **Image Tag:** This is an immutable tag tied to commit $SHORT_SHA
          - **Security:** All database credentials are environment variables only
          - **Migrations:** Run in a separate ephemeral container before app starts
          - **Health Checks:** Docker Compose waits for actual readiness, not arbitrary delays

          See `OPERATIONAL_RUNBOOK.md` for comprehensive documentation.
          EOF

          sed -i "s|VERSION_PLACEHOLDER|$VERSION|g" deployment-guide.md
          cat deployment-guide.md

      - name: Upload deployment guide
        uses: actions/upload-artifact@v4
        with:
          name: deployment-guide
          path: deployment-guide.md
          retention-days: 30

# Workflow summary
# ================
# This workflow ensures:
#   ✅ Migrations are correctly packaged before building image
#   ✅ Docker image is built with specific, immutable version tags
#   ✅ Image is only pushed to registry on main branch
#   ✅ Build metadata (date, commit SHA) is embedded in image
#   ✅ Security scanning is performed on production builds
#   ✅ Deployment instructions are generated and available
#
# Result: No more "old image" failures due to :latest tag reuse
