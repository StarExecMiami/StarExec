# GitHub Actions CI/CD Pipeline for StarExec

name: StarExec CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [UMprod, dev, containerised]
  pull_request:
    branches: [UMprod, dev, containerised]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run unit tests
        run: mvn test
      
      - name: Build and test with Docker Compose
        env:
          STAREXEC_DB_PASSWORD: ci_test_password
        run: |
          docker compose up -d --build
          docker compose ps
      
      - name: Wait for application
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:8080/starexec 2>/dev/null; do sleep 2; done'
          echo "✓ Application is ready"
      
      - name: Run integration tests
        run: |
          curl -f http://localhost:8080/starexec || exit 1

      - name: Build and push image
        if: github.event_name == 'push'
        run: |
          IMAGE_NAME=$(echo 'ghcr.io/${{ github.repository_owner }}/starexec' | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${REGISTRY} -u "${{ github.actor }}" --password-stdin
          
          docker tag starexec-app:latest ${IMAGE_NAME}:ci-${{ github.sha }}
          docker push ${IMAGE_NAME}:ci-${{ github.sha }}
          
          if [ "${{ github.ref }}" = "refs/heads/containerised" ]; then
            docker tag ${IMAGE_NAME}:ci-${{ github.sha }} ${IMAGE_NAME}:latest
            docker push ${IMAGE_NAME}:latest
          fi
      
      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose logs
      
      - name: Cleanup
        if: always()
        run: |
          docker compose down -v

  helm-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      
      - name: Lint Helm charts
        run: |
          helm lint ./chart
          for env in dev ci; do
            echo "Validating $env environment..."
            helm template starexec ./chart -f chart/values-$env.yaml > /dev/null
          done

