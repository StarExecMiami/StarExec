apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-permissions
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Ensuring directories exist (skipping chown)..."
              mkdir -p /app/data /app/sandbox /app/backend /app/work /var/lib/postgresql/data
              echo "Note: chown skipped to avoid permission errors on mounted volumes"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "starexec.volumeName" (list . "data") }}
        - name: sandbox
          persistentVolumeClaim:
            claimName: {{ include "starexec.volumeName" (list . "sandbox") }}
        - name: backend
          persistentVolumeClaim:
            claimName: {{ include "starexec.volumeName" (list . "backend") }}
        - name: work
          persistentVolumeClaim:
            claimName: {{ include "starexec.volumeName" (list . "work") }}
        - name: postgres-data
{{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "starexec.volumeName" (list . "postgres") }}
{{- else }}
          emptyDir: {}
{{- end }}
        - name: tmp
          emptyDir: {}
{{- if and (eq .Values.backend.type "podman") .Values.podman.containerSocket.enabled }}
        - name: podman-socket
          hostPath:
            path: {{ .Values.podman.containerSocket.hostPath }}
            type: Socket
{{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
             - name: http
               containerPort: 8080
{{- if eq .Values.backend.type "podman" }}
               hostPort: 7827
{{- end }}
          env:
            - name: STAREXEC_DB_HOST
              value: "{{ .Values.postgres.host }}"
            - name: STAREXEC_DB_PORT
              value: "5432"
            - name: STAREXEC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: user
            - name: STAREXEC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: password
            - name: STAREXEC_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: database
            - name: STAREXEC_CLUSTER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: user
            - name: STAREXEC_CLUSTER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: password
            - name: STAREXEC_REPORT_HOST
              value: "localhost"
            - name: STAREXEC_BACKEND_TYPE
              value: "{{ .Values.backend.type }}"
            - name: STAREXEC_BACKEND_ROOT
              value: "/app/backend"
            - name: STAREXEC_BACKEND_WORKING_DIR
              value: "/app/work"
{{- if and (eq .Values.backend.type "podman") .Values.backend.networkMode }}
            - name: STAREXEC_CONTAINER_NETWORK_MODE
              value: "{{ .Values.backend.networkMode }}"
{{- end }}
{{- if and (eq .Values.backend.type "podman") .Values.podman.containerSocket.enabled }}
            - name: STAREXEC_CONTAINER_SOCKET
              value: "unix:///run/podman/podman.sock"
            - name: STAREXEC_CONTAINER_JOB_IMAGE
              value: "{{ .Values.podman.jobImage }}"
{{- end }}
{{- if eq .Values.backend.type "podman" }}
            - name: STAREXEC_CONTAINER_MAX_CONCURRENT_JOBS
              value: "{{ .Values.podman.maxConcurrentJobs }}"
{{- end }}
{{- if .Values.backend.hostDataPath }}
            - name: STAREXEC_CONTAINER_HOST_DATA_PATH
              value: {{ .Values.backend.hostDataPath | quote }}
            - name: STAREXEC_CONTAINER_DATA_PATH
              value: "/app/data"
{{- end }}
            - name: STAREXEC_DATA_DIR
              value: "/app/data"
            - name: STAREXEC_SANDBOX_DIR
              value: "/app/sandbox"
            - name: STAREXEC_LOCAL_CONCURRENCY
              value: "{{ .Values.backend.local.concurrency }}"
            - name: STAREXEC_LOCAL_FORCE_SANDBOX
              value: "{{ .Values.backend.local.forceSandbox }}"
            - name: STAREXEC_LOCAL_USE_RUNSOLVER
              value: "{{ .Values.backend.local.useRunsolver }}"
            - name: STAREXEC_LOCAL_GRACEFUL_SHUTDOWN_SECONDS
              value: "{{ .Values.backend.local.gracefulShutdownSeconds }}"
            - name: FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: STAREXEC_URL_PREFIX
              value: "http"
            - name: STAREXEC_WEB_ADDRESS
              value: "localhost:7827"
            - name: SKIP_MIGRATIONS
              value: "{{ if .Values.migrations.enabled }}false{{ else }}true{{ end }}"
{{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: sandbox
              mountPath: /app/sandbox
            - name: backend
              mountPath: /app/backend
            - name: work
              mountPath: /app/work
            - name: tmp
              mountPath: /tmp
{{- if and (eq .Values.backend.type "podman") .Values.podman.containerSocket.enabled }}
            - name: podman-socket
              mountPath: /run/podman/podman.sock
{{- end }}
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /starexec/
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /starexec/
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (printf "%s-postgres-credentials" (include "chart.fullname" .)) }}
                  key: password
            - name: LC_COLLATE
              value: "en_US.UTF-8"
            - name: LC_CTYPE
              value: "en_US.UTF-8"
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U starexec
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
