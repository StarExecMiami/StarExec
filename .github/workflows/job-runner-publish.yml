# =============================================================================
# GitHub Actions Workflow: Job Runner Image Build & Publish
# =============================================================================
#
# This workflow builds and publishes the StarExec Job Runner container image
# to GitHub Container Registry (ghcr.io).
#
# The job-runner image is a minimal Alpine-based container used by PodmanBackend
# to execute solver jobs in isolated environments.
#
# Triggers:
#   - Push to main branches when job-runner files change
#   - Manual dispatch with version input
#   - Release tags (must use the job-runner-vX.Y.Z prefix)
#
# IMPORTANT: Release tags MUST follow the job-runner semantic versioning format:
#   • job-runner-v1.0.0 (major.minor.patch)
#
# Published tags:
#   - latest (on default branch)
#   - <branch>-<sha> (on any branch push)
#   - <major>.<minor>.<patch>, <major>.<minor>, <major> (on job-runner-vX.Y.Z releases)
#
# =============================================================================

name: Job Runner Publish

on:
  push:
    branches: [UMprod, containerised, main]
    paths:
      - 'docker/job-runner.Dockerfile'
      - 'docker/job-entrypoint.sh'
      - '.github/workflows/job-runner-publish.yml'
  pull_request:
    branches: [UMprod, containerised, main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g., 2.0.0)'
        required: false
        default: ''
      push:
        description: 'Push image to registry'
        required: true
        default: true
        type: boolean

concurrency:
  group: job-runner-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  issues: write

env:
  REGISTRY: ghcr.io
  # Note: Docker image names must be lowercase
  IMAGE_NAME: starexecmiami/starexec-job-runner

jobs:
  build:
    name: Build & Publish Job Runner
    runs-on: ubuntu-latest
    # The job-runner image is versioned independently of the StarExec
    # application. This workflow also triggers on `release: published`, so
    # without this guard publishing the application release v2.6.0 would
    # stamp starexec-job-runner:2.6.0 / :2.6 / :2 from the *application*
    # tag (see the event_name == 'release' semver rules below).
    #
    # The guard sits on the job, not on individual steps, so an application
    # release event does not build, tag, push, sign, or publish anything.
    # Branch pushes, pull requests, and workflow_dispatch are unaffected.
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'job-runner-v')
    env:
      LOCAL_IMAGE_TAG: starexec-job-runner:pr-${{ github.event.pull_request.number }}
    
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check runner workflow contracts
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 -m unittest discover -s scripts -p 'test_runner_sarif_workflows.py'
      
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: linux/amd64,linux/arm64
      
      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Validate release tag format
        id: release_tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "Release tag: $RELEASE_TAG"

          # Validate job-runner semantic versioning format (job-runner-vX.Y.Z)
          if [[ ! "$RELEASE_TAG" =~ ^job-runner-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: Job-runner release tag must follow job-runner-vX.Y.Z format" >&2
            echo "   Received: $RELEASE_TAG" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          {
            echo "version=${major}.${minor}.${patch}"
            echo "major_minor=${major}.${minor}"
            echo "major=${major}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag format is valid job-runner semantic version: ${major}.${minor}.${patch}"
        
      - name: Extract metadata for Docker
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Set latest tag for default branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/containerised' || github.ref == 'refs/heads/UMprod' }}
            # Immutable full-SHA tag for reproducible deployments
            type=sha,prefix=sha-,format=long,enable=${{ github.event_name == 'push' }}
            # Branch + short SHA (push events)
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.event_name == 'push' }}
            # Semantic version tags parsed from validated job-runner-vX.Y.Z release tag
            type=raw,value=${{ steps.release_tag.outputs.version }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ steps.release_tag.outputs.major_minor }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ steps.release_tag.outputs.major }},enable=${{ github.event_name == 'release' }}
            # Manual version input (workflow_dispatch)
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=StarExec Job Runner
            org.opencontainers.image.description=Minimal Alpine-based container for executing StarExec solver jobs
            org.opencontainers.image.vendor=StarExec Miami
      
      - name: Build pull request image
        if: github.event_name == 'pull_request'
        run: docker build --file docker/job-runner.Dockerfile --tag "${LOCAL_IMAGE_TAG}" .

      - name: Scan pull request image for vulnerabilities
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-job-runner.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Build and push image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/job-runner.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      
      - name: Scan image for vulnerabilities
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Use the first tag from metadata (most specific one)
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-job-runner.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results
        id: sarif
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        with:
          sarif_file: 'trivy-job-runner.sarif'
          category: 'trivy-job-runner'
      
      - name: Generate build summary
        if: always()
        run: |
          echo "## 🐳 Job Runner Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "**Mode:** Build and security scan (PR)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode:** Build and push to GHCR" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "| Platforms | \`linux/amd64\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Platforms | \`linux/amd64, linux/arm64\` |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Base | \`alpine:3.21\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "### Published Tags" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo '${{ steps.meta.outputs.tags }}' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.sarif.outcome }}" == "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Security Scan" >> $GITHUB_STEP_SUMMARY
            echo "✅ Trivy scan results uploaded to Security tab" >> $GITHUB_STEP_SUMMARY
          elif [ -f "trivy-job-runner.sarif" ]; then
            echo "Trivy results generated; upload status: ${{ steps.sarif.outcome }}" >> $GITHUB_STEP_SUMMARY
          fi

  # Notify on failure (optional - can be extended with Slack/email)
  notify:
    name: Notify on Failure
    needs: build
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Job Runner Build Failed - ${context.sha.substring(0, 7)}`;
            const body = `
            ## Build Failure Alert
            
            The Job Runner image build failed on \`${context.ref}\`.
            
            **Workflow Run:** [View Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Commit:** ${context.sha}
            **Triggered by:** ${context.actor}
            
            Please investigate and fix the issue.
            `;
            
            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure,job-runner'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ci-failure', 'job-runner']
              });
            }
