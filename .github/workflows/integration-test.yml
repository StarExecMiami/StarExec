name: Integration Tests

on:
  pull_request:
    branches: [UMprod, dev, containerised]
    paths:
      - "starexec-app/**"
      - "scripts/e2e/**"
      - "scripts/scientific/**"
      - "docker-compose.yml"
      - "docker-compose.podman.yml"
      - "Dockerfile"
      - "docker/migrations.sh"
      - "docker/job-runner.Dockerfile"
      - "pom.xml"
      - ".github/scripts/mvn_retry.py"
      - ".github/workflows/integration-test.yml"
  push:
    branches: [UMprod, dev, containerised]
    paths:
      - "starexec-app/**"
      - "scripts/e2e/**"
      - "scripts/scientific/**"
      - "docker-compose.yml"
      - "docker-compose.podman.yml"
      - "Dockerfile"
      - "docker/migrations.sh"
      - "docker/job-runner.Dockerfile"
      - "pom.xml"
      - ".github/scripts/mvn_retry.py"
      - ".github/workflows/integration-test.yml"
  workflow_dispatch:

concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 1: Verify migrations are packaged correctly
  verify-migrations:
    name: Verify Migrations Packaged
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven repository (verify-migrations)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-verify-migrations-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-verify-migrations-
            ${{ runner.os }}-m2-

      - name: Build application WAR
        run: |
          cd starexec-app
          python3 ../.github/scripts/mvn_retry.py -- mvn clean package -DskipTests -B --no-transfer-progress

      - name: Verify runtime config excluded from WAR
        run: |
          WAR_FILE="starexec-app/target/starexec.war"
          WAR_ENTRIES=$(mktemp)
          trap 'rm -f "$WAR_ENTRIES"' EXIT
          unzip -Z1 "$WAR_FILE" > "$WAR_ENTRIES"

          if grep -Fxq "WEB-INF/classes/flyway.conf" "$WAR_ENTRIES"; then
            echo "❌ FAILED: Runtime Flyway config was packaged in the WAR"
            exit 1
          fi
          echo "✅ PASSED: Runtime Flyway config excluded from WAR"

      - name: Verify migration files in source
        run: |
          MIGRATION_DIR="starexec-app/src/main/resources/db/migration"
          SOURCE_COUNT=$(find "$MIGRATION_DIR" -maxdepth 1 -type f -name "*.sql" 2>/dev/null | wc -l)

          echo "Source migration files: $SOURCE_COUNT"
          if [ "$SOURCE_COUNT" -lt 1 ]; then
            echo "❌ FAILED: Expected at least 1 migration file, found $SOURCE_COUNT"
            exit 1
          fi
          echo "✅ PASSED: Migration source files verified"

      - name: Verify migrations in WAR
        run: |
          WAR_FILE="starexec-app/target/starexec.war"
          WAR_COUNT=$(unzip -l "$WAR_FILE" 2>/dev/null | grep -c "WEB-INF/classes/db/migration" || echo 0)

          echo "WAR migration entries: $WAR_COUNT"
          if [ "$WAR_COUNT" -lt 1 ]; then
            echo "❌ FAILED: Expected migration entries in WAR, found $WAR_COUNT"
            exit 1
          fi
          echo "✅ PASSED: Migrations packaged in WAR correctly"

      - name: List packaged migrations
        run: |
          WAR_FILE="starexec-app/target/starexec.war"
          echo "Packaged migration files:"
          unzip -l "$WAR_FILE" 2>/dev/null | grep "WEB-INF/classes/db/migration.*\.sql$" | awk '{print $NF}' || echo "(none found)"

  # Job 2: Integration tests with Docker Compose
  integration-test:
    name: Docker Compose Integration Tests
    runs-on: ubuntu-latest
    needs: verify-migrations
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (uses GHA cache from Container Publish workflow)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/starexecmiami/starexec:ci-test-latest
            ghcr.io/starexecmiami/starexec:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.sha }}

      - name: Verify Docker image availability
        run: |
          echo "Verifying Docker image is available locally..."
          docker image inspect ghcr.io/starexecmiami/starexec:ci-test-latest > /dev/null 2>&1 && \
            echo "✓ Image ci-test-latest found" || \
            { echo "✗ Image not found"; docker images | grep starexec; exit 1; }
          echo "Verification passed"

      - name: Verify runtime config excluded from Docker image
        run: |
          IMAGE="ghcr.io/starexecmiami/starexec:${{ github.sha }}"
          if ! docker run --rm --user 0 --entrypoint sh "$IMAGE" -eu -c \
            'test ! -e "$CATALINA_HOME/webapps/starexec/WEB-INF/classes/flyway.conf"'; then
            echo "❌ FAILED: Runtime Flyway config was packaged in the Docker image"
            exit 1
          fi
          echo "✅ PASSED: Runtime Flyway config excluded from Docker image"

      - name: Start PostgreSQL service
        env:
          STAREXEC_DB_PASSWORD: ci_test_password_secure_12345
          STAREXEC_DB_HOST: postgres
          STAREXEC_DB_PORT: 5432
          STAREXEC_DB_NAME: starexec
          STAREXEC_DB_USER: starexec
          STAREXEC_DB_SCHEMA: starexec
          STAREXEC_VERSION: ci-test-latest
          VOLUME_PREFIX: starexec-ci
          DOCKER_BUILDKIT: 1
        run: |
          echo "Starting PostgreSQL service..."
          docker compose up -d postgres
          echo "✓ PostgreSQL container created"

      - name: Wait for PostgreSQL to accept connections
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          timeout 120 bash -c 'until docker compose exec -T postgres pg_isready -U starexec 2>/dev/null; do
            sleep 2
          done'
          echo "✓ PostgreSQL is accepting connections"

      - name: Run database migrations
        env:
          STAREXEC_DB_PASSWORD: ci_test_password_secure_12345
          STAREXEC_DB_HOST: postgres
          STAREXEC_DB_PORT: 5432
          STAREXEC_DB_NAME: starexec
          STAREXEC_DB_USER: starexec
          STAREXEC_DB_SCHEMA: starexec
          STAREXEC_VERSION: ci-test-latest
          VOLUME_PREFIX: starexec-ci
          DOCKER_BUILDKIT: 1
        run: |
          echo "Running database migrations..."
          echo "Checking if image is available..."
          docker image inspect ghcr.io/starexecmiami/starexec:ci-test-latest || { echo "Image not found!"; exit 1; }
          # Use docker compose run to execute migrations service
          # The --rm flag removes the container after it exits
          # Exit code from migrations will propagate to this step
          docker compose run --rm migrations
          MIGRATION_EXIT=$?

          if [ $MIGRATION_EXIT -eq 0 ]; then
            echo "✓ Migrations completed successfully"
          else
            echo "✗ Migrations failed with exit code $MIGRATION_EXIT"
            exit $MIGRATION_EXIT
          fi

      - name: Verify credentials not exposed in migration logs
        if: always()
        run: |
          echo "Verifying credential redaction in migration logs..."
          LOGS=$(docker compose logs migrations 2>/dev/null || echo "")

          # Check for common password patterns
          if echo "$LOGS" | grep -E "(password|passwd|pwd)\s*[:=]" | grep -v "REDACTED" > /dev/null 2>&1; then
            echo "✗ FAILED: Potential credential exposure detected!"
            echo "Problematic patterns found:"
            echo "$LOGS" | grep -E "(password|passwd|pwd)\s*[:=]" | head -5 || true
            exit 1
          fi

          # Verify we see redaction markers
          if echo "$LOGS" | grep -F "REDACTED" > /dev/null 2>&1; then
            echo "✓ PASSED: Credentials properly redacted in logs"
          else
            echo "⚠ WARNING: No credential redaction markers found - verify this is expected"
          fi

      - name: Start StarExec application
        env:
          STAREXEC_DB_PASSWORD: ci_test_password_secure_12345
          STAREXEC_DB_HOST: postgres
          STAREXEC_DB_PORT: 5432
          STAREXEC_DB_NAME: starexec
          STAREXEC_DB_USER: starexec
          STAREXEC_DB_SCHEMA: starexec
          STAREXEC_VERSION: ci-test-latest
          VOLUME_PREFIX: starexec-ci
          DOCKER_BUILDKIT: 1
        run: |
          echo "Starting StarExec application..."
          docker compose up -d starexec
          echo "✓ Application container started"

      - name: Wait for application to be healthy
        run: |
          echo "Waiting for StarExec application to be healthy..."
          timeout 180 bash -c 'until curl -sf http://localhost:8080/starexec/ > /dev/null 2>&1; do
            sleep 3
            echo "Waiting for application..."
          done'
          echo "✓ Application is responding at http://localhost:8080/starexec/"

      - name: Verify application health
        run: |
          echo "Testing application endpoints..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/starexec/)
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "✓ Application health check passed (HTTP $HTTP_STATUS)"
          else
            echo "✗ Application health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Verify database schema initialization
        run: |
          echo "Verifying database schema was initialized..."
          MIGRATIONS_COUNT=$(docker compose exec -T postgres psql -U starexec -d starexec -t -c "
            SELECT COUNT(*) FROM flyway_schema_history WHERE success = true;" 2>/dev/null || echo "0")

          # Remove leading/trailing whitespace
          MIGRATIONS_COUNT=$(echo "$MIGRATIONS_COUNT" | xargs)

          if [ -z "$MIGRATIONS_COUNT" ] || [ "$MIGRATIONS_COUNT" -eq 0 ]; then
            echo "✗ FAILED: No migrations found in flyway_schema_history"
            exit 1
          fi

          echo "✓ Database schema initialized: $MIGRATIONS_COUNT successful migrations applied"

      - name: Run integration test suite
        run: |
          echo "Running integration test suite..."
          echo ""

          # Test 1: Basic connectivity
          echo "Test 1: Basic application connectivity..."
          if curl -sf http://localhost:8080/starexec/ > /dev/null 2>&1; then
            echo "✓ Test 1 PASSED: Application is accessible"
          else
            echo "✗ Test 1 FAILED: Cannot reach application"
            exit 1
          fi

          # Test 2: Check all services are healthy
          echo "Test 2: Verify all services are running..."
          RUNNING_SERVICES=$(docker compose ps --services --filter "status=running" 2>/dev/null | wc -l)
          EXPECTED_SERVICES=3  # postgres, migrations (exited ok), starexec

          if [ "$RUNNING_SERVICES" -ge 2 ]; then
            echo "✓ Test 2 PASSED: Required services are running ($RUNNING_SERVICES active)"
          else
            echo "✗ Test 2 FAILED: Expected at least 2 running services, found $RUNNING_SERVICES"
            docker compose ps
            exit 1
          fi

          # Test 3: Database connectivity from app
          echo "Test 3: Verify database is accessible..."
          if docker compose exec -T postgres psql -U starexec -d starexec -c "SELECT 1;" > /dev/null 2>&1; then
            echo "✓ Test 3 PASSED: Database is accessible"
          else
            echo "✗ Test 3 FAILED: Cannot connect to database"
            exit 1
          fi

          echo ""
          echo "✓ All integration tests completed successfully"

      - name: Run deployed E2E matrix checks (LocalBackend, fresh)
        run: |
          set -euo pipefail
          TMP_E2E=$(mktemp -d /tmp/starexec-e2e-local-XXXXXX)
          trap 'rm -rf "$TMP_E2E"' EXIT
          python3 -m venv "$TMP_E2E/venv"
          "$TMP_E2E/venv/bin/pip" install --quiet requests bcrypt

          "$TMP_E2E/venv/bin/python" scripts/e2e/run.py --verify-endpoints --commit "${{ github.sha }}"
          "$TMP_E2E/venv/bin/python" scripts/e2e/run.py --fixtures-only --fixture-mode reproducible-offline

          APP_IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/starexecmiami/starexec:${{ github.sha }}" 2>/dev/null || docker image inspect --format='{{.Id}}' "ghcr.io/starexecmiami/starexec:${{ github.sha }}")
          SHORT_SHA=$(printf '%s' "${{ github.sha }}" | cut -c1-8)
          cat > "$TMP_E2E/local-e2e-config.json" <<EOF
          {
            "backend": "local",
            "mode": "fresh",
            "fixture_mode": "reproducible-offline",
            "base_url": "http://127.0.0.1:8080/starexec",
            "deployment_name": "sq-${SHORT_SHA}-loc",
            "db_exec": ["docker", "exec", "-i", "starexec-postgres", "psql", "-U", "starexec", "-d", "starexec", "-X", "-qAt", "-v", "ON_ERROR_STOP=1"],
            "app_exec": ["docker", "exec", "-i", "starexec-app"],
            "app_data_root": "/app/data",
            "queue_id": "auto",
            "commit": "${{ github.sha }}",
            "image": "ghcr.io/starexecmiami/starexec:${{ github.sha }}",
            "image_digest": "${APP_IMAGE_DIGEST}",
            "report_dir": "$PWD/starexec-app/target/e2e-reports/local",
            "allowed_hosts": [],
            "admin_user_id": 1,
            "enable_browser": false,
            "timeouts": {"upload": 180, "job": 300, "pause": 60, "kill": 60, "dispatch": 120, "smtp": 30}
          }
          EOF

          "$TMP_E2E/venv/bin/python" scripts/e2e/run.py \
            --config "$TMP_E2E/local-e2e-config.json" \
            --mode fresh \
            --only 0,1,3,4,5,6,7,8,10,11 \
            --matrix-out starexec-app/target/e2e-reports/local

          python3 - <<'PY' "${{ github.sha }}"
          import json, sys
          sha = sys.argv[1]
          with open("starexec-app/target/e2e-reports/local/matrix-report.json", encoding="utf-8") as fh:
              report = json.load(fh)
          assert report["commitSha"] == sha, report
          assert report["mode"] == "fresh", report
          assert report["matrixDenominator"] == 63, report
          counts = report["countsByStatus"]
          assert counts["FAIL"] == 0, report
          assert counts["PASS"] > 0, report
          print(f"Verified LocalBackend E2E matrix: PASS={counts['PASS']}, BLOCKED={counts['BLOCKED']}, SKIPPED={counts['SKIPPED']}, FAIL={counts['FAIL']}")
          PY

      - name: Upload LocalBackend E2E matrix artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-matrix-local
          if-no-files-found: ignore
          path: starexec-app/target/e2e-reports/local/

      - name: Set up Java for legacy TestSequence suite
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven repository (legacy-test-sequences)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-legacy-seq-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-verify-migrations-
            ${{ runner.os }}-m2-

      - name: Run mandatory legacy TestSequence layer (COMPONENT_DAO)
        env:
          STAREXEC_DB_HOST: 127.0.0.1
          STAREXEC_DB_PORT: 5432
          STAREXEC_DB_NAME: starexec
          STAREXEC_DB_USER: starexec
          STAREXEC_DB_PASS: ci_test_password_secure_12345
          STAREXEC_DB_PASSWORD: ci_test_password_secure_12345
          STAREXEC_DB_SCHEMA: starexec
          STAREXEC_TEST_COMMUNITY_ID: "2"
          STAREXEC_ALLOW_TESTING: "true"
        run: |
          set -euo pipefail
          # Stop app poller so background schedulers do not mutate fixture jobs mid-test
          docker compose stop starexec
          TMP_ROOT=$(mktemp -d /tmp/starexec-legacy-XXXXXX)
          trap 'rm -rf "$TMP_ROOT"' EXIT
          mkdir -p "$TMP_ROOT/data" "$TMP_ROOT/web"
          export STAREXEC_DATA_DIR="$TMP_ROOT/data"
          export STAREXEC_WEB_BASE_DIR="$TMP_ROOT/web"
          mvn -B -ntp verify -Plegacy-test-sequences -pl starexec-app \
            -Dtest="LegacyTestSequenceDiscoveryTest,LegacyTestSequenceEngineTest,LegacyFixtureClasspathTest" \
            -Dstarexec.legacy.layers=COMPONENT_DAO \
            -Dstarexec.legacy.gitSha="${{ github.sha }}"
          python3 - <<'PY' "${{ github.sha }}"
          import json, sys
          expected_sha = sys.argv[1]
          with open("starexec-app/target/legacy-sequence-reports/legacy-sequence-report.json", encoding="utf-8") as fh:
              report = json.load(fh)
          assert report.get("commitSha") == expected_sha, report
          assert report.get("totalMethods", 0) > 0, report
          assert report.get("failedSequences", -1) == 0, report
          assert report.get("failedMethods", -1) == 0, report
          print(f"Verified legacy-sequence-report.json: total={report['totalMethods']}, passed={report['passedMethods']}, failed={report['failedMethods']}, sha={report['commitSha']}")
          PY

      - name: Upload legacy TestSequence reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legacy-test-sequence-reports
          if-no-files-found: ignore
          path: |
            starexec-app/target/legacy-sequence-reports/
            starexec-app/target/failsafe-reports/

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Service Status ==="
          docker compose ps -a
          echo ""
          echo "=== Docker Compose Logs (Last 100 lines) ==="
          docker compose logs --tail=100 || true
          echo ""
          echo "=== Migrations Service Logs ==="
          docker compose logs migrations || true
          echo ""
          echo "=== StarExec Application Logs (Last 50 lines) ==="
          docker compose logs --tail=50 starexec || true
          echo ""
          echo "=== PostgreSQL Logs (Last 50 lines) ==="
          docker compose logs --tail=50 postgres || true

      - name: Capture system diagnostics on failure
        if: failure()
        run: |
          echo "=== System Information ==="
          echo "Disk Space:"
          df -h || true
          echo ""
          echo "Memory Usage:"
          free -h || true
          echo ""
          echo "Docker Info:"
          docker system df || true
          echo ""
          echo "Docker Network:"
          docker network inspect starexec-ci_starexec_network 2>/dev/null || docker network ls || true

      - name: Cleanup Docker Compose
        if: always()
        run: |
          echo "Cleaning up Docker Compose services..."
          docker compose down -v --remove-orphans
          echo "✓ Cleanup complete"

  # Job 3: PodmanBackend deployed E2E prerequisites and matrix gate
  podman-e2e:
    name: PodmanBackend E2E Matrix
    runs-on: ubuntu-latest
    needs: verify-migrations
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Podman rootless prerequisites and execute or record BLOCKED matrix
        run: |
          set -euo pipefail
          TMP_E2E=$(mktemp -d /tmp/starexec-e2e-podman-XXXXXX)
          cleanup() {
            docker compose -f docker-compose.yml -f docker-compose.podman.yml down -v --remove-orphans 2>/dev/null || true
            rm -rf "$TMP_E2E"
          }
          trap cleanup EXIT

          mkdir -p starexec-app/target/e2e-reports/podman
          python3 -m venv "$TMP_E2E/venv"
          "$TMP_E2E/venv/bin/pip" install --quiet requests bcrypt

          "$TMP_E2E/venv/bin/python" scripts/e2e/run.py --verify-endpoints --commit "${{ github.sha }}"
          "$TMP_E2E/venv/bin/python" scripts/e2e/run.py --fixtures-only --fixture-mode reproducible-offline

          PODMAN_REASON=""
          if ! command -v podman >/dev/null 2>&1; then
            PODMAN_REASON="podman binary is not installed on runner"
          elif ! grep -q "^$(id -un):" /etc/subuid 2>/dev/null; then
            PODMAN_REASON="rootless subuid range unavailable for runner user"
          elif ! podman info >/dev/null 2>&1; then
            PODMAN_REASON="podman info failed on runner"
          fi

          if [ -z "$PODMAN_REASON" ]; then
            SOCK_DIR="${XDG_RUNTIME_DIR:-/tmp/podman-run-$(id -u)}"
            mkdir -p "$SOCK_DIR/podman"
            PODMAN_SOCK="$SOCK_DIR/podman/podman.sock"
            if [ ! -S "$PODMAN_SOCK" ]; then
              podman system service --time=0 "unix://$PODMAN_SOCK" > "$TMP_E2E/podman-svc.log" 2>&1 &
              for _ in $(seq 1 15); do
                if [ -S "$PODMAN_SOCK" ]; then break; fi
                sleep 1
              done
            fi
            if [ ! -S "$PODMAN_SOCK" ]; then
              PODMAN_REASON="rootless podman socket could not be started on runner"
            elif ! podman build -t starexec/job-runner:latest -f docker/job-runner.Dockerfile . >/dev/null 2>&1; then
              PODMAN_REASON="failed to build starexec/job-runner:latest under rootless podman"
            fi
          fi

          if [ -n "$PODMAN_REASON" ]; then
            echo "::warning::PodmanBackend E2E prerequisites unavailable: $PODMAN_REASON"
            set +e
            "$TMP_E2E/venv/bin/python" scripts/e2e/run.py \
              --record-blocked \
              --backend podman \
              --mode fresh \
              --commit "${{ github.sha }}" \
              --reason "$PODMAN_REASON" \
              --matrix-out starexec-app/target/e2e-reports/podman
            RC=$?
            set -e
            test "$RC" -eq 2
            exit 0
          fi

          docker build -t "ghcr.io/starexecmiami/starexec:ci-test-latest" -t "ghcr.io/starexecmiami/starexec:${{ github.sha }}" .
          APP_IMAGE_DIGEST=$(docker image inspect --format='{{.Id}}' "ghcr.io/starexecmiami/starexec:${{ github.sha }}")
          STAREXEC_DB_PASSWORD=ci_test_password_secure_12345 \
          STAREXEC_VERSION=ci-test-latest \
          VOLUME_PREFIX=starexec-podman-ci \
          CONTAINER_SOCKET="$PODMAN_SOCK" \
            docker compose -f docker-compose.yml -f docker-compose.podman.yml up -d

          timeout 240 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/starexec/public/health/readiness)" = "200" ]; do sleep 3; done'

          SHORT_SHA=$(printf '%s' "${{ github.sha }}" | cut -c1-8)
          cat > "$TMP_E2E/podman-e2e-config.json" <<EOF
          {
            "backend": "podman",
            "mode": "fresh",
            "fixture_mode": "reproducible-offline",
            "base_url": "http://127.0.0.1:8080/starexec",
            "deployment_name": "sq-${SHORT_SHA}-pdm",
            "db_exec": ["docker", "exec", "-i", "starexec-postgres", "psql", "-U", "starexec", "-d", "starexec", "-X", "-qAt", "-v", "ON_ERROR_STOP=1"],
            "app_exec": ["docker", "exec", "-i", "starexec-app"],
            "app_data_root": "/app/data",
            "queue_id": "auto",
            "commit": "${{ github.sha }}",
            "image": "ghcr.io/starexecmiami/starexec:${{ github.sha }}",
            "image_digest": "${APP_IMAGE_DIGEST}",
            "report_dir": "$PWD/starexec-app/target/e2e-reports/podman",
            "allowed_hosts": [],
            "admin_user_id": 1,
            "enable_browser": false,
            "timeouts": {"upload": 180, "job": 300, "pause": 60, "kill": 60, "dispatch": 120, "smtp": 30}
          }
          EOF

          "$TMP_E2E/venv/bin/python" scripts/e2e/run.py \
            --config "$TMP_E2E/podman-e2e-config.json" \
            --backend podman \
            --mode fresh \
            --only 0,1,3,4,5,6,7,8,10,11 \
            --matrix-out starexec-app/target/e2e-reports/podman

      - name: Upload PodmanBackend E2E matrix artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-matrix-podman
          if-no-files-found: ignore
          path: starexec-app/target/e2e-reports/podman/

  # Job 4: Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [verify-migrations, integration-test, podman-e2e]
    if: always()

    steps:
      - name: Report test results
        run: |
          MIGRATIONS_RESULT="${{ needs.verify-migrations.result }}"
          INTEGRATION_RESULT="${{ needs.integration-test.result }}"
          PODMAN_RESULT="${{ needs.podman-e2e.result }}"

          if [ "$MIGRATIONS_RESULT" = "success" ] && [ "$INTEGRATION_RESULT" = "success" ] && [ "$PODMAN_RESULT" = "success" ]; then
            echo "## ✅ All Integration Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Migrations:** ✅ Verified and packaged correctly" >> $GITHUB_STEP_SUMMARY
            echo "**Docker Compose (LocalBackend + E2E):** ✅ Passed" >> $GITHUB_STEP_SUMMARY
            echo "**PodmanBackend E2E Matrix:** ✅ Executed or recorded BLOCKED prereqs" >> $GITHUB_STEP_SUMMARY
            echo "**Credentials:** ✅ Properly redacted in logs" >> $GITHUB_STEP_SUMMARY
            echo "**Application:** ✅ Healthy and responding" >> $GITHUB_STEP_SUMMARY
            echo "**Database:** ✅ Migrations applied successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "$MIGRATIONS_RESULT" = "cancelled" ] || [ "$INTEGRATION_RESULT" = "cancelled" ] || [ "$PODMAN_RESULT" = "cancelled" ]; then
            echo "## ⚠️ Integration Tests Cancelled" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Verify Migrations:** $MIGRATIONS_RESULT" >> $GITHUB_STEP_SUMMARY
            echo "**Integration Tests:** $INTEGRATION_RESULT" >> $GITHUB_STEP_SUMMARY
            echo "**Podman E2E Matrix:** $PODMAN_RESULT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This run was superseded by a newer run. No action needed." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Integration Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Verify Migrations:** $MIGRATIONS_RESULT" >> $GITHUB_STEP_SUMMARY
            echo "**Integration Tests:** $INTEGRATION_RESULT" >> $GITHUB_STEP_SUMMARY
            echo "**Podman E2E Matrix:** $PODMAN_RESULT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See job logs above for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
