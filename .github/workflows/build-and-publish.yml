# GitHub Actions CI/CD Pipeline for StarExec

name: StarExec CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [UMprod, dev, containerised]
  pull_request:
    branches: [UMprod, dev, containerised]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/starexec
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set lowercase image name
        id: image_name
        run: |
          echo "image_name=$(echo 'ghcr.io/${{ github.repository_owner }}/starexec' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "image_tag=ci-${{ github.sha }}" >> $GITHUB_OUTPUT
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run unit tests
        run: |
          mvn test
      
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ${REGISTRY} -u "${{ github.actor }}" --password-stdin
      
      - name: Build image
        run: |
          make build IMAGE_NAME=${{ steps.image_name.outputs.image_name }} IMAGE_TAG=${{ steps.image_name.outputs.image_tag }}
      
      - name: Deploy ephemeral environment
        env:
          STAREXEC_DB_PASSWORD: ci_test_password
        run: |
          make deploy-podman ENV=ci IMAGE_NAME=${{ steps.image_name.outputs.image_name }} IMAGE_TAG=${{ steps.image_name.outputs.image_tag }}
      
      - name: Wait for services
        run: |
          echo "Waiting for MySQL to be ready..."
          MYSQL_CONTAINER=$(podman ps --format '{{.Names}}' | grep mysql | head -1)
          echo "Found MySQL container: $MYSQL_CONTAINER"
          timeout 120 bash -c "until podman exec $MYSQL_CONTAINER mysqladmin ping -h localhost --silent; do sleep 2; done"
          
          echo "Waiting for StarExec application..."
          timeout 120 bash -c 'until curl -f http://localhost:7827/starexec > /dev/null 2>&1; do sleep 2; done'
          echo "Services are ready!"
      
      - name: Run migrations
        env:
          STAREXEC_DB_PASSWORD: ci_test_password
        run: |
          make migrate-podman IMAGE_NAME=${{ steps.image_name.outputs.image_name }} IMAGE_TAG=${{ steps.image_name.outputs.image_tag }}
      
      - name: Run integration tests
        run: |
          # Add your test commands here
          curl -f http://localhost:7827/starexec/health || exit 1

      - name: Push image to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          podman push ${{ steps.image_name.outputs.image_name }}:${{ steps.image_name.outputs.image_tag }}
          if [ "${{ github.ref }}" = "refs/heads/containerised" ]; then
            podman tag ${{ steps.image_name.outputs.image_name }}:${{ steps.image_name.outputs.image_tag }} ${{ steps.image_name.outputs.image_name }}:latest
            podman push ${{ steps.image_name.outputs.image_name }}:latest
          fi
      
      - name: Collect logs on failure
        if: failure()
        run: |
          echo "Listing all containers..."
          podman ps -a
          echo ""
          echo "Collecting logs from all containers..."
          for container in $(podman ps -a --format '{{.Names}}' | grep -E 'starexec|mysql'); do
            echo "Collecting logs from: $container"
            podman logs "$container" > "${container}-logs.txt" 2>&1 || echo "Failed to collect logs from $container"
          done
      
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: |
            *-logs.txt
      
      - name: Cleanup
        if: always()
        run: |
          make undeploy-podman IMAGE_NAME=${{ steps.image_name.outputs.image_name }} IMAGE_TAG=${{ steps.image_name.outputs.image_tag }}
          podman system prune -af

  helm-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      
      - name: Lint Helm charts
        run: make lint
      
      - name: Validate all environments
        run: |
          for env in dev ci; do
            echo "Validating ENV=$env"
            helm template starexec ./chart -f chart/values-$env.yaml > /dev/null
          done
