version: '3.8'

services:
  starexec:
    container_name: starexec_container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      STAREXEC_DB_HOST: mysql
      STAREXEC_DB_USER: starexec
      STAREXEC_DB_PASSWORD: starexec_password
      STAREXEC_DB_NAME: starexec
      
      # Email Configuration (configure as needed)
      STAREXEC_EMAIL_SMTP: localhost
      STAREXEC_EMAIL_PORT: 25
      STAREXEC_EMAIL_USER: noreply@starexec.local
      STAREXEC_CONTACT_EMAIL: admin@starexec.local
      
      # Web Configuration
      STAREXEC_WEB_ADDRESS: localhost
      STAREXEC_APP_NAME: ""
      STAREXEC_PROXY_SCHEME: http://
      STAREXEC_PROXY_PORT: 8080
      
      # Data directories
      STAREXEC_DATA_DIR: /app/data
      STAREXEC_SANDBOX_DIR: /app/sandbox
      
      # Backend Configuration
      STAREXEC_BACKEND_TYPE: local
      STAREXEC_BACKEND_ROOT: /app/backend
      STAREXEC_BACKEND_WORKING_DIR: /app/work
      
      # Testing
      STAREXEC_ALLOW_TESTING: "True"
      STAREXEC_TEST_COMMUNITY_ID: 1
      
    volumes:
      - starexec_data:/app/data
      - starexec_sandbox:/app/sandbox
      - starexec_backend:/app/backend
      - starexec_work:/app/work
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - starexec_network

  mysql:
    container_name: starexec_mysql
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: starexec
      MYSQL_USER: starexec
      MYSQL_PASSWORD: starexec_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["docker-entrypoint.sh", "mysqld", "--log-bin-trust-function-creators=1"] # Required for certain MySQL functions used by StarExec
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u starexec -pstarexec_password"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - starexec_network

volumes:
  starexec_data:
  starexec_sandbox:
  starexec_backend:
  starexec_work:
  mysql_data:

networks:
  starexec_network:
    driver: bridge