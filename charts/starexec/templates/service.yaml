apiVersion: v1
kind: Service
metadata:
  name: starexec
  labels:
    app: starexec
spec:
  type: {{ .Values.service.type }}
  selector:
    app: starexec
  ports:
    - name: http
      port: {{ .Values.service.port | default 8080 }}
      targetPort: {{ .Values.service.targetPort | default 8080 }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    - name: postgres
      port: 5432
      targetPort: 5432
