name: Scientific fixture tooling

on:
  push:
    paths:
      - '.github/workflows/scientific-fixtures.yml'
      - 'scripts/e2e/**'
      - 'scripts/scientific/**'
      - 'scripts/tests/test_*.py'
  pull_request:
    paths:
      - '.github/workflows/scientific-fixtures.yml'
      - 'scripts/e2e/**'
      - 'scripts/scientific/**'
      - 'scripts/tests/test_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    name: Offline recipe, verifier and wrapper regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check wrapper and processor syntax and portability
        run: |
          sh -n scripts/scientific/starexec_run_E-3.3.3-sequential
          shellcheck -s sh scripts/scientific/starexec_run_E-3.3.3-sequential
          sh -n scripts/scientific/tptp_benchmark_processor.sh
          shellcheck -s sh scripts/scientific/tptp_benchmark_processor.sh
          sh -n scripts/scientific/szs_post_processor.sh
          shellcheck -s sh scripts/scientific/szs_post_processor.sh
      - name: Verify tracked fixture lockfiles and provenance schema
        run: python3 scripts/scientific/verify_fixtures.py
      - name: Check source validation, verifier, packaging, wrapper, and processor behavior
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
