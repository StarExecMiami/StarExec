# Kubernetes development values for quokka.
#
# This profile is for the Jenkins/dev namespace on quokka's MicroK8s cluster.
# Local Podman development lives in values-local-dev.yaml.

image:
  repository: ghcr.io/starexecmiami/starexec
  # Manual deployments that keep `latest` should leave pullPolicy at Always.
  # CI/CD overrides tag and pullPolicy with a unique per-build tag + IfNotPresent.
  tag: latest
  pullPolicy: Always

replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: quokka

postgres:
  image:
    repository: docker.io/library/postgres
    tag: "15"
    pullPolicy: IfNotPresent
  host: localhost
  port: 5432
  user: starexec
  database: starexec
  existingSecret: starexec-postgres-credentials
  existingSecretKeys:
    user: user
    password: password
    database: database
    rootPassword: rootPassword
  persistence:
    enabled: false

backend:
  type: kubernetes

kubernetes:
  jobNamespace: starexec-dev
  jobImage: ghcr.io/starexecmiami/starexec-job-runner:latest
  # Always, because this profile deliberately tracks a mutable ":latest" and a developer
  # who pushes a new job-runner expects the next pair to run it.
  #
  # Written out because this key used to be inert -- nothing read it -- so it had no
  # bearing on behaviour, and Kubernetes derived Always from the ":latest" tag anyway.
  # Now that the value is wired through to the pod, leaving the previous IfNotPresent here
  # would quietly pin development to whatever image each node happened to cache.
  jobImagePullPolicy: Always
  jobServiceAccount: starexec-job
  maxConcurrentJobs: 10
  nodeSelector:
    starexec.org/worker: "true"
  dataPvc:
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "31"
      memory: "250Gi"

persistence:
  enabled: true
  storageClass: microk8s-hostpath
  appDataSize: 10Gi
  backendSize: 5Gi
  sandboxSize: 5Gi
  workSize: 5Gi
  postgresDataSize: 20Gi

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30081

ingress:
  enabled: false

monitoring:
  enabled: false

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

web:
  address: "localhost"
  urlPrefix: "http"
  proxyPort: 30081
